.bob{animation:bob 500ms ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){.spin,.bob{animation:none}}

    <span style="font-weight: 800; font-size: 38px; line-height: 1; letter-spacing: -0.03em">1994</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":720}}'>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.iv = setInterval(function () {
      var t = ((self.state && self.state.t) || 9) + 0.25;
      if (t > 30) t = 0;
      self.setState({ t: t });
    }, 250);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    var t = (this.state && this.state.t) || 9;
    var p = t / 30;
    var sec = Math.floor(t);
    return { tape: { l: (1 - 0.6 * p).toFixed(3), r: (0.4 + 0.6 * p).toFixed(3), w: (220 * p).toFixed(1), time: '0:' + (sec < 10 ? '0' : '') + sec } };
  }
}
</script>
