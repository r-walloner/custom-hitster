<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinyl Night — style tile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF6B35}a:hover{color:#FF8A5C}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template"><div style="width: 1280px; height: 820px; box-sizing: border-box; padding: 56px; background: #16120F; color: #F4EADB; font-family: Inter, system-ui, sans-serif; display: grid; grid-template-columns: 360px minmax(0, 1fr) minmax(0, 1fr); gap: 56px">

  <!-- Column 1: identity + palette -->
  <div style="display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0B0908" stroke="#3A2F27" stroke-width="2"></circle><circle cx="20" cy="20" r="13" fill="none" stroke="#2C241E" stroke-width="1.5"></circle><circle cx="20" cy="20" r="8" fill="#FF6B35"></circle><circle cx="20" cy="20" r="1.8" fill="#16120F"></circle></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">jamster</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #B8A994">Direction A</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 56px; line-height: 0.95; letter-spacing: -0.03em">Vinyl Night</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #D9CDBB">A record shop after closing. Warm dark ground, cream type, one hot tangerine for whatever needs a tap. Song cards are record sleeves; the hidden song is a label still spinning.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 52px; border-radius: 10px; background: #16120F; border: 1px solid #3A2F27"></div><span style="font-size: 13px; font-weight: 600">Groove</span><span style="font-size: 12px; color: #B8A994">#16120F · ground</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 52px; border-radius: 10px; background: #241D18"></div><span style="font-size: 13px; font-weight: 600">Sleeve</span><span style="font-size: 12px; color: #B8A994">#241D18 · surfaces</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 52px; border-radius: 10px; background: #F4EADB"></div><span style="font-size: 13px; font-weight: 600">Cream</span><span style="font-size: 12px; color: #B8A994">#F4EADB · text</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 52px; border-radius: 10px; background: #FF6B35"></div><span style="font-size: 13px; font-weight: 600">Tangerine</span><span style="font-size: 12px; color: #B8A994">#FF6B35 · action, your turn</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 52px; border-radius: 10px; background: #F2B544"></div><span style="font-size: 13px; font-weight: 600">Gold</span><span style="font-size: 12px; color: #B8A994">#F2B544 · tokens</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 52px; border-radius: 10px; display: flex; overflow: hidden"><div style="flex: 1; background: #7FD1AE"></div><div style="flex: 1; background: #FF5C7A"></div></div><span style="font-size: 13px; font-weight: 600">Mint / Rose</span><span style="font-size: 12px; color: #B8A994">right / wrong, always with icon</span></div>
    </div>
  </div>

  <!-- Column 2: type -->
  <div style="display: flex; flex-direction: column; gap: 28px; border-left: 1px solid #2C241E; padding-left: 40px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #B8A994">Type</span>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 132px; line-height: 0.85; letter-spacing: -0.04em; color: #FF6B35; font-variant-numeric: tabular-nums">1977</span>
      <span style="font-size: 13px; color: #B8A994">Years · Bricolage Grotesque 800, tabular figures</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em">Lea nailed it.<br>Card is hers.</span>
      <span style="font-size: 13px; color: #B8A994">Headlines and round results · Bricolage 700</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 18px; line-height: 1.5; color: #F4EADB">Place the song on your timeline. Earlier or later than the cards you hold?</span>
      <span style="font-size: 13px; color: #B8A994">Body and UI · Inter 400–600, 16–20 px on the TV</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #D9CDBB">Turn 7 · 38 cards left · first to 10</span>
      <span style="font-size: 13px; color: #B8A994">Labels · Inter 600, tracked caps</span>
    </div>
  </div>

  <!-- Column 3: components -->
  <div style="display: flex; flex-direction: column; gap: 28px; border-left: 1px solid #2C241E; padding-left: 40px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #B8A994">Pieces</span>

    <div style="display: flex; gap: 16px; align-items: flex-end">
      <!-- hidden card -->
      <div style="width: 156px; height: 196px; border-radius: 16px; background: #FF6B35; color: #16120F; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">Now playing</span>
        <div style="align-self: center; width: 104px; height: 104px; border-radius: 50%; background: repeating-radial-gradient(circle, #16120F 0 2px, #241D18 2px 4px); display: flex; align-items: center; justify-content: center">
          <div style="width: 40px; height: 40px; border-radius: 50%; background: #F4EADB; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; color: #16120F">?</div>
        </div>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; text-align: center">????</span>
      </div>
      <!-- revealed card -->
      <div style="width: 156px; height: 196px; border-radius: 16px; background: #241D18; border: 1px solid #3A2F27; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden">
        <div style="position: absolute; right: -46px; top: -46px; width: 110px; height: 110px; border-radius: 50%; background: repeating-radial-gradient(circle, #1C1713 0 2px, #2A221C 2px 4px)" aria-hidden="true"></div>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.03em; color: #FF6B35; position: relative">1977</span>
        <span style="font-size: 15px; font-weight: 600; line-height: 1.25; margin-top: 8px">Dreams</span>
        <span style="font-size: 13px; color: #D9CDBB">Fleetwood Mac</span>
        <span style="margin-top: auto; font-size: 12px; color: #B8A994; display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 16px; border-radius: 50%; background: #7FD1AE; color: #16120F; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">J</span>from Jonas's library</span>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <button type="button" style="min-height: 48px; padding: 0 22px; border: none; border-radius: 999px; background: #FF6B35; color: #16120F; font: 700 16px Inter, sans-serif">Lock it in</button>
      <button type="button" style="min-height: 48px; padding: 0 22px; border: 2px solid #F4EADB; border-radius: 999px; background: transparent; color: #F4EADB; font: 600 16px Inter, sans-serif">Challenge</button>
      <button type="button" style="min-height: 48px; padding: 0 18px; border: none; border-radius: 999px; background: #241D18; color: #D9CDBB; font: 600 16px Inter, sans-serif">Pass</button>
    </div>

    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(#FF6B35 0 60%, #2C241E 60% 100%); display: flex; align-items: center; justify-content: center">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: #16120F; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">6</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px; font-weight: 600">Challenge window</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #F2B544"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.5" fill="none" stroke="#F2B544" stroke-width="1.6"></circle><circle cx="9" cy="9" r="3" fill="#F2B544"></circle></svg>3 tokens</span>
      </div>
    </div>
  </div>
</div></template>
<script src="dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
DCRuntime.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-template').content, {});
</script>
</body>
</html>
