<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand font · Bagel Fat One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B83A20}a:hover{color:#8F2C17}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.8s linear infinite}
.bob{animation:bob 500ms ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){.spin,.bob{animation:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template"><div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 48px 56px; background: #F6EEDF; color: #2A211C; font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; align-items: baseline; gap: 24px">
    <h1 style="margin: 0; font-family: 'Bagel Fat One', sans-serif; font-weight: 400; font-size: 44px; line-height: 1">Bagel Fat One</h1>
    <p style="margin: 0; font-size: 17px; color: #5C4F44; max-width: 760px">Bubbly and soft, like a puffy sticker. The friendliest, the most party. UI stays Bricolage Grotesque.</p>
  </div>

  <div style="height: 300px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
    <div style="border-radius: 22px; background: #FFFAF0; border: 2.5px solid #2A211C; box-sizing: border-box; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #5C4F44">L1 · Sticker</span>
      <div style="flex: 1; display: flex; align-items: center; justify-content: center"><div style="transform: rotate(-4deg); background: #EE5A3C; border: 3px solid #2A211C; box-shadow: 5px 5px 0 #2A211C; padding: 8px 22px; border-radius: 12px; display: inline-block"><span style="font-family: 'Bagel Fat One', sans-serif; font-weight: 400; font-size: 60px; line-height: 1.1; color: #2A211C; white-space: nowrap">JAMSTER</span></div></div>
      <div style="display: flex; align-items: center; gap: 16px; border-top: 2px solid #EDE2CE; padding-top: 12px"><span style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #5C4F44">header size</span><div style="transform: rotate(-4deg); background: #EE5A3C; border: 2px solid #2A211C; box-shadow: 2px 2px 0 #2A211C; padding: 2px 10px; border-radius: 6px; display: inline-block"><span style="font-family: 'Bagel Fat One', sans-serif; font-weight: 400; font-size: 18px; line-height: 1.1; color: #2A211C; white-space: nowrap">JAMSTER</span></div></div>
    </div>
    <div style="border-radius: 22px; background: #FFFAF0; border: 2.5px solid #2A211C; box-sizing: border-box; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #5C4F44">L2 · Pill</span>
      <div style="flex: 1; display: flex; align-items: center; justify-content: center"><div style="transform: rotate(-4deg); background: #EE5A3C; border: 3px solid #2A211C; box-shadow: 5px 5px 0 #2A211C; padding: 4px 30px 8px; border-radius: 999px; display: inline-block"><span style="font-family: 'Bagel Fat One', sans-serif; font-weight: 400; font-size: 60px; line-height: 1.15; color: #2A211C; white-space: nowrap">jamster</span></div></div>
      <div style="display: flex; align-items: center; gap: 16px; border-top: 2px solid #EDE2CE; padding-top: 12px"><span style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #5C4F44">header size</span><div style="transform: rotate(-4deg); background: #EE5A3C; border: 2px solid #2A211C; box-shadow: 2px 2px 0 #2A211C; padding: 1px 12px 3px; border-radius: 999px; display: inline-block"><span style="font-family: 'Bagel Fat One', sans-serif; font-weight: 400; font-size: 18px; line-height: 1.15; color: #2A211C; white-space: nowrap">jamster</span></div></div>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 1.35fr 1fr 0.9fr; gap: 24px">
    <div style="border-radius: 22px; background: #FFFAF0; border: 2.5px solid #2A211C; box-sizing: border-box; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #5C4F44">Next to the UI font · phone header at real size</span>
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px">
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: #F6EEDF">
          <div style="transform: rotate(-4deg); background: #EE5A3C; border: 2px solid #2A211C; box-shadow: 2px 2px 0 #2A211C; padding: 0 10px 3px; border-radius: 999px; display: inline-block"><span style="font-family: 'Bagel Fat One', sans-serif; font-weight: 400; font-size: 17px; line-height: 1.15; color: #2A211C; white-space: nowrap">jamster</span></div>
          <span style="padding: 3px 8px; border-radius: 8px; border: 2px solid #2A211C; background: #FFFAF0; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.14em">QZRK</span>
          <span style="font-size: 13px; font-weight: 600; color: #5C4F44">Turn 7 · 38 left · first to 10</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 12px">
          <span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #B83A20">Challenge window</span>
          <span style="font-weight: 800; font-size: 22px; letter-spacing: -0.01em">Mara put it between 1994 and 2008.</span>
          <span style="font-size: 15px; color: #5C4F44">Think she's off? Spend a token and mark where it really goes.</span>
        </div>
      </div>
    </div>
    <div style="border-radius: 22px; background: #FFFAF0; border: 2.5px solid #2A211C; box-sizing: border-box; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #5C4F44">Big moments in the brand font</span>
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px">
        <span style="font-family: 'Bagel Fat One', sans-serif; font-weight: 400; font-size: 44px; line-height: 1.05">Lea nailed it!</span>
        <span style="font-size: 16px; font-weight: 600">The card is hers · 6 of 10</span>
        <div style="align-self: flex-start; transform: rotate(-4deg); margin-top: 8px; width: 96px; height: 112px; border-radius: 12px; background: #E9B43A; border: 2px solid #2A211C; box-shadow: 3px 3px 0 #2A211C; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Bagel Fat One', sans-serif; font-size: 26px">????</span></div>
      </div>
    </div>
    <div style="border-radius: 22px; background: #FFFAF0; border: 2.5px solid #2A211C; box-sizing: border-box; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #5C4F44">On the tape</span>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
        <div class="bob" style="padding: 6px"><div style="transform: rotate(-4deg)"><svg width="230" height="146" viewBox="0 0 300 190" role="img" aria-label="Cassette playing the mystery song" style="display: block; filter: drop-shadow(4px 4px 0 #2A211C)">
  <rect x="4" y="4" width="292" height="182" rx="18" fill="#EE5A3C" stroke="#2A211C" stroke-width="7"></rect>
  <circle cx="17" cy="17" r="4.5" fill="#2A211C"></circle><circle cx="283" cy="17" r="4.5" fill="#2A211C"></circle><circle cx="17" cy="173" r="4.5" fill="#2A211C"></circle><circle cx="283" cy="173" r="4.5" fill="#2A211C"></circle>
  <rect x="92" y="70" width="116" height="40" rx="20" fill="#3A2E26"></rect>
  <circle cx="105" cy="90" r="36" fill="#6B4228" style="transform: scale({{tape.l}}); transform-box: fill-box; transform-origin: center; transition: transform 0.25s linear"></circle>
  <circle cx="195" cy="90" r="36" fill="#6B4228" style="transform: scale({{tape.r}}); transform-box: fill-box; transform-origin: center; transition: transform 0.25s linear"></circle>
  <g class="spin"><circle cx="105" cy="90" r="13" fill="#FFFAF0" stroke="#2A211C" stroke-width="4"></circle><path d="M105 80v20M96.3 85l17.4 10M96.3 95l17.4-10" stroke="#2A211C" stroke-width="4" stroke-linecap="round"></path></g>
  <g class="spin"><circle cx="195" cy="90" r="13" fill="#FFFAF0" stroke="#2A211C" stroke-width="4"></circle><path d="M195 80v20M186.3 85l17.4 10M186.3 95l17.4-10" stroke="#2A211C" stroke-width="4" stroke-linecap="round"></path></g>
  <path fill-rule="evenodd" d="M30 18H270A8 8 0 0 1 278 26V138A8 8 0 0 1 270 146H30A8 8 0 0 1 22 138V26A8 8 0 0 1 30 18Z M92 70H208A20 20 0 0 1 208 110H92A20 20 0 0 1 92 70Z" fill="#FFFAF0" stroke="#2A211C" stroke-width="5"></path>
  <text x="150" y="58" text-anchor="middle" font-family="'Bagel Fat One', sans-serif" font-size="30" fill="#2A211C">? ? ? ?</text>
  <rect x="40" y="122" width="220" height="11" rx="5.5" fill="#EDE2CE"></rect>
  <rect x="40" y="122" width="{{tape.w}}" height="11" rx="5.5" fill="#EE5A3C" style="transition: width 0.25s linear"></rect>
  <path d="M78 186L90 156H210L222 186" fill="#D44A2E" stroke="#2A211C" stroke-width="5" stroke-linejoin="round"></path>
  <circle cx="112" cy="174" r="6" fill="#2A211C"></circle><circle cx="188" cy="174" r="6" fill="#2A211C"></circle>
</svg></div></div>
        <span style="font-family: 'DM Mono', monospace; font-size: 13px">{{tape.time}} / 0:30</span>
      </div>
    </div>
  </div>
</div></template>
<script src="dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.iv = setInterval(function () {
      var t = ((self.state && self.state.t) || 9) + 0.25;
      if (t > 30) t = 0;
      self.setState({ t: t });
    }, 250);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    var t = (this.state && this.state.t) || 9;
    var p = t / 30;
    var sec = Math.floor(t);
    return { tape: { l: (1 - 0.6 * p).toFixed(3), r: (0.4 + 0.6 * p).toFixed(3), w: (220 * p).toFixed(1), time: '0:' + (sec < 10 ? '0' : '') + sec } };
  }
}
DCRuntime.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-template').content, {});
</script>
</body>
</html>
