<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinyl Night — host screen, challenge window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16120F}
a{color:#FF6B35}a:hover{color:#FF8A5C}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template"><div style="min-height: 900px; box-sizing: border-box; background: #16120F; color: #F4EADB; font-family: Inter, system-ui, sans-serif">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 28px 40px 40px; display: flex; flex-direction: column; gap: 28px">

  <!-- Top bar -->
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
    <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0B0908" stroke="#3A2F27" stroke-width="2"></circle><circle cx="20" cy="20" r="13" fill="none" stroke="#2C241E" stroke-width="1.5"></circle><circle cx="20" cy="20" r="8" fill="#FF6B35"></circle><circle cx="20" cy="20" r="1.8" fill="#16120F"></circle></svg>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em">jamster</span>
      </div>
      <span style="padding: 6px 12px; border-radius: 8px; background: #241D18; font-size: 14px; font-weight: 600; letter-spacing: 0.18em">QZRK</span>
    </div>
    <div style="display: flex; align-items: center; gap: 22px; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #D9CDBB; flex-wrap: wrap">
      <span>Turn 7</span><span aria-hidden="true" style="color: #3A2F27">●</span><span>38 cards left</span><span aria-hidden="true" style="color: #3A2F27">●</span><span>First to 10</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #B8A994">Acting as
        <select style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #3A2F27; background: #241D18; color: #F4EADB; font: 600 14px Inter, sans-serif"><option>Mara (on turn)</option><option>Jonas</option><option>Lea</option><option>Tobi</option><option>Sam</option></select>
      </label>
      <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #3A2F27; background: transparent; color: #D9CDBB; font: 600 14px Inter, sans-serif">End game</button>
    </div>
  </header>

  <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

    <!-- Main column -->
    <main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

      <section style="display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch">
        <!-- Song in play -->
        <div style="display: flex; flex-direction: column; gap: 12px; flex: 0 0 auto">
          <div style="width: 216px; height: 264px; border-radius: 20px; background: #FF6B35; color: #16120F; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; justify-content: space-between">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">Now playing</span>
            <div style="align-self: center; width: 150px; height: 150px; border-radius: 50%; background: repeating-radial-gradient(circle, #16120F 0 2px, #241D18 2px 4px); display: flex; align-items: center; justify-content: center">
              <div style="width: 56px; height: 56px; border-radius: 50%; background: #F4EADB; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px">?</div>
            </div>
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; text-align: center; letter-spacing: 0.06em">????</span>
          </div>
          <div style="width: 216px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #D9CDBB"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FD1AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>Living Room</span>
            <div style="display: flex; gap: 6px">
              <button type="button" aria-label="Restart song" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3A2F27; background: #241D18; color: #F4EADB; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
              <button type="button" aria-label="Retry dropped players" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3A2F27; background: #241D18; color: #F4EADB; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M21 3v5h-5"></path><path d="M3 21v-5h5"></path></svg></button>
            </div>
          </div>
        </div>

        <!-- Challenge window -->
        <div style="flex: 1 1 380px; min-width: 0; border-radius: 20px; background: #241D18; box-sizing: border-box; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 20px">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #FF6B35">Challenge window</span>
              <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em">Mara put it between 1994 and 2008.</h2>
              <p style="margin: 0; font-size: 16px; color: #D9CDBB">Think she's off? Spend a token and mark where it really goes.</p>
            </div>
            <div style="width: 88px; height: 88px; flex: 0 0 auto; border-radius: 50%; background: conic-gradient(#FF6B35 0 60%, #3A2F27 60% 100%); display: flex; align-items: center; justify-content: center">
              <div style="width: 72px; height: 72px; border-radius: 50%; background: #241D18; display: flex; flex-direction: column; align-items: center; justify-content: center">
                <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1">6</span>
                <span style="font-size: 11px; color: #B8A994">sec</span>
              </div>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <sc-for list="{{challengers}}" as="c" hint-placeholder-count="4">
              <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 4px 4px 12px; border-radius: 12px; background: #1C1713">
                <span style="width: 30px; height: 30px; border-radius: 50%; background: {{c.color}}; color: #16120F; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center">{{c.init}}</span>
                <span style="font-size: 16px; font-weight: 600">{{c.name}}</span>
                <sc-if value="{{c.host}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #B8A994; padding: 3px 8px; border: 1px solid #3A2F27; border-radius: 999px">no phone · host taps</span></sc-if>
                <span style="flex: 1"></span>
                <sc-if value="{{c.open}}" hint-placeholder-val="{{true}}">
                  <div style="display: flex; gap: 6px">
                    <button type="button" style="min-height: 44px; padding: 0 18px; border: 2px solid #F4EADB; border-radius: 999px; background: transparent; color: #F4EADB; font: 600 15px Inter, sans-serif">Challenge</button>
                    <button type="button" style="min-height: 44px; padding: 0 16px; border: none; border-radius: 999px; background: #2C241E; color: #D9CDBB; font: 600 15px Inter, sans-serif">Pass</button>
                  </div>
                </sc-if>
                <sc-if value="{{c.challenging}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; min-height: 44px; border-radius: 999px; background: #FF6B35; color: #16120F; font-size: 15px; font-weight: 700">Challenging · marking…</span></sc-if>
                <sc-if value="{{c.passed}}" hint-placeholder-val="{{false}}"><span style="padding: 0 16px; font-size: 15px; color: #B8A994">Passed</span></sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </section>

      <!-- Timeline -->
      <section style="border-radius: 20px; background: #1C1713; border: 1px solid #2C241E; box-sizing: border-box; padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px">Mara's timeline</h2>
          <span style="font-size: 14px; color: #B8A994">4 of 10 cards · Jonas's mark stays hidden until the reveal</span>
        </div>
        <div style="overflow-x: auto">
          <div style="display: flex; align-items: center; gap: 12px; min-width: max-content; padding-bottom: 4px">
            <div style="width: 148px; height: 176px; border-radius: 14px; background: #241D18; border: 1px solid #3A2F27; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 4px">
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 38px; line-height: 1; color: #FF6B35">1975</span>
              <span style="font-size: 14px; font-weight: 600; margin-top: 8px">Bohemian Rhapsody</span>
              <span style="font-size: 13px; color: #D9CDBB">Queen</span>
              <span style="margin-top: auto; font-size: 12px; color: #B8A994">via Lea</span>
            </div>
            <div style="width: 28px; height: 120px; border-radius: 8px; border: 2px dashed #3A2F27" aria-hidden="true"></div>
            <div style="width: 148px; height: 176px; border-radius: 14px; background: #241D18; border: 1px solid #3A2F27; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 4px">
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 38px; line-height: 1; color: #FF6B35">1994</span>
              <span style="font-size: 14px; font-weight: 600; margin-top: 8px">Zombie</span>
              <span style="font-size: 13px; color: #D9CDBB">The Cranberries</span>
              <span style="margin-top: auto; font-size: 12px; color: #B8A994">via Mara</span>
            </div>
            <div style="width: 148px; height: 176px; border-radius: 14px; border: 2px dashed #FF6B35; background: #2A1A12; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
              <div style="width: 56px; height: 56px; border-radius: 50%; background: repeating-radial-gradient(circle, #16120F 0 2px, #241D18 2px 4px); display: flex; align-items: center; justify-content: center" aria-hidden="true"><div style="width: 20px; height: 20px; border-radius: 50%; background: #FF6B35"></div></div>
              <span style="font-size: 14px; font-weight: 700; color: #FF6B35">Mara's pick</span>
              <span style="font-size: 12px; color: #B8A994">locked in</span>
            </div>
            <div style="width: 148px; height: 176px; border-radius: 14px; background: #241D18; border: 1px solid #3A2F27; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 4px">
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 38px; line-height: 1; color: #FF6B35">2008</span>
              <span style="font-size: 14px; font-weight: 600; margin-top: 8px">Viva la Vida</span>
              <span style="font-size: 13px; color: #D9CDBB">Coldplay</span>
              <span style="margin-top: auto; font-size: 12px; color: #B8A994">via Tobi</span>
            </div>
            <div style="width: 28px; height: 120px; border-radius: 8px; border: 2px dashed #3A2F27" aria-hidden="true"></div>
            <div style="width: 148px; height: 176px; border-radius: 14px; background: #241D18; border: 1px solid #3A2F27; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 4px">
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 38px; line-height: 1; color: #FF6B35">2016</span>
              <span style="font-size: 14px; font-weight: 600; margin-top: 8px">Redbone</span>
              <span style="font-size: 13px; color: #D9CDBB">Childish Gambino</span>
              <span style="margin-top: auto; font-size: 12px; color: #B8A994">via Jonas</span>
            </div>
            <div style="width: 28px; height: 120px; border-radius: 8px; border: 2px dashed #3A2F27" aria-hidden="true"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Standings -->
    <aside style="flex: 1 1 300px; min-width: 0; border-radius: 20px; background: #241D18; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #B8A994">Standings</h2>
      <sc-for list="{{players}}" as="p" hint-placeholder-count="5">
        <div style="border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: {{p.bg}}; border: 1px solid {{p.border}}">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="width: 30px; height: 30px; border-radius: 50%; background: {{p.color}}; color: #16120F; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center">{{p.init}}</span>
            <span style="font-size: 16px; font-weight: 600">{{p.name}}</span>
            <sc-if value="{{p.turn}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #FF6B35">On turn</span></sc-if>
            <span style="flex: 1"></span>
            <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: #F2B544"><svg width="14" height="14" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.5" fill="none" stroke="#F2B544" stroke-width="1.8"></circle><circle cx="9" cy="9" r="3" fill="#F2B544"></circle></svg>{{p.tokens}}</span>
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; min-width: 44px; text-align: right">{{p.cards}}<span style="font-size: 13px; font-weight: 500; color: #B8A994">/10</span></span>
          </div>
          <div style="height: 6px; border-radius: 3px; background: #16120F; overflow: hidden"><div style="height: 6px; width: {{p.bar}}; background: {{p.color}}"></div></div>
          <div style="display: flex; flex-wrap: wrap; gap: 4px">
            <sc-for list="{{p.years}}" as="y" hint-placeholder-count="4"><span style="font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 6px; background: #16120F; color: #D9CDBB; font-variant-numeric: tabular-nums">{{y.t}}</span></sc-for>
          </div>
        </div>
      </sc-for>
    </aside>
  </div>
</div>
</div></template>
<script src="dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    var mk = function (arr) { return arr.map(function (t) { return { t: t }; }); };
    var players = [
      { init: 'M', name: 'Mara', cards: 4, tokens: 2, color: '#FF6B35', turn: true, years: mk(['’75', '’94', '’08', '’16']) },
      { init: 'J', name: 'Jonas', cards: 6, tokens: 1, color: '#7FD1AE', turn: false, years: mk(['’69', '’83', '’91', '’01', '’12', '’19']) },
      { init: 'L', name: 'Lea', cards: 5, tokens: 3, color: '#F2B544', turn: false, years: mk(['’78', '’86', '’99', '’05', '’21']) },
      { init: 'T', name: 'Tobi', cards: 3, tokens: 2, color: '#C4B5FF', turn: false, years: mk(['’80', '’97', '’14']) },
      { init: 'S', name: 'Sam', cards: 2, tokens: 4, color: '#F4EADB', turn: false, years: mk(['’88', '’03']) }
    ].map(function (p) {
      return Object.assign({}, p, {
        bar: (p.cards * 10) + '%',
        bg: p.turn ? '#2E231C' : '#1C1713',
        border: p.turn ? '#FF6B35' : '#2C241E'
      });
    });
    var challengers = [
      { init: 'J', name: 'Jonas', color: '#7FD1AE', challenging: true },
      { init: 'L', name: 'Lea', color: '#F2B544', open: true },
      { init: 'T', name: 'Tobi', color: '#C4B5FF', passed: true },
      { init: 'S', name: 'Sam', color: '#F4EADB', open: true, host: true }
    ].map(function (c) { return Object.assign({ open: false, challenging: false, passed: false, host: false }, c); });
    return { players: players, challengers: challengers };
  }
}
DCRuntime.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-template').content, {});
</script>
</body>
</html>
