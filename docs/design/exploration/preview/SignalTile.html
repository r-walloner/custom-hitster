<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal — style tile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C6FF3D}a:hover{color:#DBFF85}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template"><div style="width: 1280px; height: 820px; box-sizing: border-box; padding: 56px; background: #0B0E1A; color: #E8ECF8; font-family: Inter, system-ui, sans-serif; display: grid; grid-template-columns: 360px minmax(0, 1fr) minmax(0, 1fr); gap: 56px">

  <!-- Column 1 -->
  <div style="display: flex; flex-direction: column; gap: 26px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="14" width="5" height="16" rx="2.5" fill="#C6FF3D"></rect><rect x="11" y="5" width="5" height="25" rx="2.5" fill="#C6FF3D"></rect><rect x="19" y="10" width="5" height="20" rx="2.5" fill="#C6FF3D"></rect><rect x="27" y="18" width="5" height="12" rx="2.5" fill="#C6FF3D"></rect></svg>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.03em">jamster</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #9AA3BF">Direction C</span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 56px; line-height: 0.95; letter-spacing: -0.03em">Signal</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #C5CBE0">The mixing desk at 1 a.m. A midnight ground, an electric lime for the one thing to press, and a decade spectrum running along every timeline, so you can read the shape of a hand from across the room.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 44px; border-radius: 10px; background: #0B0E1A; border: 1px solid #2A3250"></div><span style="font-size: 13px; font-weight: 600">Midnight</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA3BF">#0B0E1A · ground</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 44px; border-radius: 10px; background: #1A2036"></div><span style="font-size: 13px; font-weight: 600">Desk</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA3BF">#1A2036 · surfaces</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 44px; border-radius: 10px; background: #C6FF3D"></div><span style="font-size: 13px; font-weight: 600">Lime</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA3BF">#C6FF3D · action, your turn</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 44px; border-radius: 10px; background: #8B7CFF"></div><span style="font-size: 13px; font-weight: 600">Violet</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA3BF">#8B7CFF · challenges</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">Decade spectrum</span>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><div style="height: 28px; width: 100%; border-radius: 6px; background: #FF7A59"></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #C5CBE0">60s</span></div>
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><div style="height: 28px; width: 100%; border-radius: 6px; background: #FFB547"></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #C5CBE0">70s</span></div>
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><div style="height: 28px; width: 100%; border-radius: 6px; background: #FF5FA2"></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #C5CBE0">80s</span></div>
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><div style="height: 28px; width: 100%; border-radius: 6px; background: #8B7CFF"></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #C5CBE0">90s</span></div>
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><div style="height: 28px; width: 100%; border-radius: 6px; background: #3DD6FF"></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #C5CBE0">00s</span></div>
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><div style="height: 28px; width: 100%; border-radius: 6px; background: #5BE3A1"></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #C5CBE0">10s</span></div>
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><div style="height: 28px; width: 100%; border-radius: 6px; background: #E8ECF8"></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #C5CBE0">20s</span></div>
      </div>
      <span style="font-size: 12px; color: #9AA3BF">A hint, never the answer: the year is always written out.</span>
    </div>
  </div>

  <!-- Column 2 -->
  <div style="display: flex; flex-direction: column; gap: 28px; border-left: 1px solid #222A45; padding-left: 40px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #9AA3BF">Type</span>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 116px; line-height: 0.85; letter-spacing: -0.04em; color: #C6FF3D">1977</span>
      <span style="font-size: 13px; color: #9AA3BF">Years · JetBrains Mono 800, a readout</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em">Lea nailed it.<br>Card is hers.</span>
      <span style="font-size: 13px; color: #9AA3BF">Headlines · Space Grotesk 700</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 18px; line-height: 1.5">Place the song on your timeline. Earlier or later than the cards you hold?</span>
      <span style="font-size: 13px; color: #9AA3BF">Body · Inter 400–600</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #C5CBE0">TURN 07 · 38 LEFT · FIRST TO 10</span>
      <span style="font-size: 13px; color: #9AA3BF">Meta · JetBrains Mono 500, caps</span>
    </div>
  </div>

  <!-- Column 3 -->
  <div style="display: flex; flex-direction: column; gap: 28px; border-left: 1px solid #222A45; padding-left: 40px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #9AA3BF">Pieces</span>

    <div style="display: flex; gap: 16px; align-items: flex-end">
      <!-- hidden -->
      <div style="width: 156px; height: 196px; border-radius: 16px; background: #1A2036; border: 1.5px solid #C6FF3D; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #C6FF3D">● LIVE</span>
        <div style="display: flex; align-items: flex-end; justify-content: center; gap: 5px; height: 80px" aria-hidden="true">
          <div style="width: 9px; height: 30px; border-radius: 4px; background: #C6FF3D"></div><div style="width: 9px; height: 62px; border-radius: 4px; background: #C6FF3D"></div><div style="width: 9px; height: 44px; border-radius: 4px; background: #C6FF3D"></div><div style="width: 9px; height: 78px; border-radius: 4px; background: #C6FF3D"></div><div style="width: 9px; height: 52px; border-radius: 4px; background: #C6FF3D"></div><div style="width: 9px; height: 24px; border-radius: 4px; background: #C6FF3D"></div><div style="width: 9px; height: 40px; border-radius: 4px; background: #C6FF3D"></div>
        </div>
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 28px; text-align: center; color: #E8ECF8">----</span>
      </div>
      <!-- revealed -->
      <div style="width: 156px; height: 196px; border-radius: 16px; background: #1A2036; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
        <div style="height: 6px; background: #FFB547" aria-hidden="true"></div>
        <div style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1">
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 38px; line-height: 1; letter-spacing: -0.04em">1977</span>
          <span style="font-size: 15px; font-weight: 600; margin-top: 8px">Dreams</span>
          <span style="font-size: 13px; color: #C5CBE0">Fleetwood Mac</span>
          <span style="margin-top: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA3BF">SRC · JONAS</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <button type="button" style="min-height: 48px; padding: 0 22px; border: none; border-radius: 12px; background: #C6FF3D; color: #0B0E1A; font: 700 16px Inter, sans-serif">Lock it in</button>
      <button type="button" style="min-height: 48px; padding: 0 22px; border: 1.5px solid #8B7CFF; border-radius: 12px; background: #221F4A; color: #E8ECF8; font: 600 16px Inter, sans-serif">Challenge</button>
      <button type="button" style="min-height: 48px; padding: 0 18px; border: none; border-radius: 12px; background: #1A2036; color: #C5CBE0; font: 600 16px Inter, sans-serif">Pass</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 15px; font-weight: 600">Challenge window</span><span style="font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 22px; color: #8B7CFF">0:06</span></div>
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
        <div style="height: 10px; border-radius: 3px; background: #8B7CFF"></div><div style="height: 10px; border-radius: 3px; background: #8B7CFF"></div><div style="height: 10px; border-radius: 3px; background: #8B7CFF"></div><div style="height: 10px; border-radius: 3px; background: #8B7CFF"></div><div style="height: 10px; border-radius: 3px; background: #8B7CFF"></div><div style="height: 10px; border-radius: 3px; background: #8B7CFF"></div><div style="height: 10px; border-radius: 3px; background: #2A3250"></div><div style="height: 10px; border-radius: 3px; background: #2A3250"></div><div style="height: 10px; border-radius: 3px; background: #2A3250"></div><div style="height: 10px; border-radius: 3px; background: #2A3250"></div>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #C5CBE0"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="#C6FF3D" stroke-width="1.6" transform="rotate(45 8 8)"></rect></svg>3 tokens</span>
    </div>
  </div>
</div></template>
<script src="dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
DCRuntime.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-template').content, {});
</script>
</body>
</html>
