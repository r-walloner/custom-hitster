<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jamster – dealing</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/jamster/tokens.css">
<link rel="stylesheet" href="ds/jamster/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.deal-card{flex:none;animation:deal-land 0.55s cubic-bezier(0.2,0.9,0.3,1.25) both}
@keyframes deal-land{from{opacity:0;transform:translateY(-48px) rotate(-10deg) scale(0.85)}60%{opacity:1}to{opacity:1;transform:none}}
.deal-wait .jm-caption{animation:deal-breathe 1.2s ease-in-out infinite alternate}
@keyframes deal-breathe{from{opacity:1}to{opacity:0.4}}
@media (prefers-reduced-motion: reduce){.deal-card,.deal-wait .jm-caption{animation:none}}
</style>
</helmet>
<main class="jm-screen">
  <header class="jm-header">
    <span class="jm-logo">jamster</span>
    <span class="jm-chip" aria-label="Room code LUMA">LUMA</span>
    <span class="jm-header__spacer"></span>
    <span class="jm-header__meta"><span>Mara's room</span><i></i><span><b>4</b> players</span><i></i><span>First to <b>10</b></span></span>
  </header>
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-16); padding-bottom: calc(2 * var(--space-16))">
    <h1 class="jm-moment__headline">Dealing the opening cards</h1>
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-14) var(--space-16)">
      <sc-for list="{{players}}" as="p" hint-placeholder-count="4">
        <div style="width: var(--card-w); display: flex; flex-direction: column; align-items: center; gap: var(--space-8)">
          <div style="max-width: 100%; display: flex; align-items: center; gap: var(--space-6)">
            <span class="jm-avatar {{p.color}}" aria-hidden="true">{{p.initial}}</span>
            <span class="jm-section" style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
          </div>
          <sc-if value="{{p.dealt}}" hint-placeholder-val="{{true}}">
            <div class="jm-card deal-card"><span class="jm-card__year">{{p.year}}</span><span class="jm-card__title">{{p.title}}</span><span class="jm-card__artist">{{p.artist}}</span></div>
          </sc-if>
          <sc-if value="{{p.waiting}}" hint-placeholder-val="{{false}}">
            <div class="deal-wait" style="width: var(--card-w); height: var(--card-h); box-sizing: border-box; border-radius: var(--radius-card); border: var(--stroke-control) dashed var(--slot-dash); display: flex; align-items: center; justify-content: center"><span class="jm-caption">Dealing…</span></div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dealt":{"editor":"range","min":0,"max":4,"step":1,"default":2},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const dealt = Math.max(0, Math.min(4, Number(this.props.dealt ?? 2)));
    // In turn order, each opening card face up as it lands.
    const base = [
      { name: "Mara", color: "jm-p1", year: "1984", title: "Smalltown Boy", artist: "Bronski Beat" },
      { name: "Sam", color: "jm-p2", year: "2010", title: "Dancing On My Own", artist: "Robyn" },
      { name: "Lea", color: "jm-p3", year: "1974", title: "Waterloo", artist: "ABBA" },
      { name: "Jonas", color: "jm-p4", year: "1998", title: "Doo Wop (That Thing)", artist: "Lauryn Hill" }
    ];
    const players = base.map((p, i) => ({ ...p, initial: p.name.charAt(0), dealt: i < dealt, waiting: i >= dealt }));
    return { players };
  }
}
</script>
</body>
</html>
