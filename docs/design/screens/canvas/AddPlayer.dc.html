<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jamster – add a player</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/jamster/tokens.css">
<link rel="stylesheet" href="ds/jamster/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="jm-overlay" style="width: 844px; height: 390px">
  <div class="jm-overlay__under"><dc-import name="Lobby" hint-size="844px,390px"></dc-import></div>
  <div class="jm-scrim"></div>
  <section class="jm-dialog" role="dialog" aria-modal="true" aria-labelledby="name-head">
    <div class="jm-dialog__head">
      <h1 id="name-head" class="jm-headline">{{title}}</h1>
      <button type="button" class="jm-btn jm-btn--icon jm-btn--bare" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
    </div>
    <form style="display: flex; flex-direction: column; gap: 10px" onSubmit="{{noop}}">
      <sc-if value="{{add}}" hint-placeholder-val="{{true}}">
        <p class="jm-meta">Plays on this device. No phone needed.</p>
      </sc-if>
      <div class="jm-dialog__name">
        <span class="jm-avatar jm-avatar--xl {{color}}" aria-hidden="true">{{initial}}</span>
        <input type="text" class="jm-input" aria-label="Name" value="{{name}}" onInput="{{onName}}" maxlength="16" autocomplete="nickname">
      </div>
      <div class="jm-pair" style="margin-top: 6px">
        <button type="button" class="jm-btn">Cancel</button>
        <button type="submit" class="jm-btn jm-btn--primary" disabled="{{empty}}">{{submit}}</button>
      </div>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["add","rename"],"default":"add"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const add = (this.props.kind ?? "add") === "add";
    const name = this.state.name ?? (add ? "Ilse" : "Mara");
    const shown = name.trim();
    return {
      add,
      title: add ? "Add local player" : "Change your name",
      color: add ? "jm-p5" : "jm-p1",
      name,
      initial: (shown || "?").charAt(0).toUpperCase(),
      empty: !shown,
      submit: add ? (shown ? "Add " + shown : "Add") : "Save",
      onName: (e) => this.setState({ name: e.target.value.slice(0, 16) }),
      noop: (e) => e.preventDefault()
    };
  }
}
</script>
</body>
</html>
