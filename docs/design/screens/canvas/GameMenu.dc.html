<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jamster – game menu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/jamster/tokens.css">
<link rel="stylesheet" href="ds/jamster/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="jm-overlay" style="width: 844px; height: 390px">
  <div class="jm-overlay__under"><dc-import name="GamePlacing" hint-size="844px,390px"></dc-import></div>
  <div class="jm-scrim"></div>
  <section class="jm-dialog" role="dialog" aria-modal="true" aria-labelledby="menu-head">
    <div class="jm-dialog__head">
      <h1 id="menu-head" class="jm-headline">Menu</h1>
      <button type="button" class="jm-btn jm-btn--icon jm-btn--bare" aria-label="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
    </div>
    <sc-if value="{{music}}" hint-placeholder-val="{{true}}">
      <div class="jm-setting">
        <div class="jm-setting__text"><h2 class="jm-label">Music plays on</h2><span class="jm-setting__value">Living room TV</span></div>
        <a href="Playback.dc.html" class="jm-btn">Change</a>
      </div>
    </sc-if>
    <a href="Standings.dc.html" class="jm-btn jm-btn--nav">Scoreboard <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <sc-if value="{{host}}" hint-placeholder-val="{{true}}">
      <button type="button" class="jm-btn jm-btn--dark" style="margin-top: 4px" onClick="{{tapEnd}}">{{endLabel}}</button>
    </sc-if>
    <sc-if value="{{guest}}" hint-placeholder-val="{{false}}">
      <a href="Main.dc.html" class="jm-btn jm-btn--dark" style="margin-top: 4px">Leave game</a>
      <p class="jm-caption">Open the room link again to get your seat back.</p>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["host","guest"],"default":"host"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const host = (this.props.role ?? "host") === "host";
    const ending = !!this.state.ending;
    return {
      host,
      guest: !host,
      // Only a device whose own Spotify plays the music can move it: the host's with one speaker, everyone's with separate speakers.
      music: host,
      endLabel: ending ? "Tap again to end it for everyone" : "End game",
      tapEnd: () => this.setState({ ending: !ending })
    };
  }
}
</script>
</body>
</html>
