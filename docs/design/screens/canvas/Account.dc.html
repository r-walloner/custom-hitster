<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jamster – your account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/jamster/tokens.css">
<link rel="stylesheet" href="ds/jamster/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="jm-overlay" style="width: 844px; height: 390px">
  <div class="jm-overlay__under"><dc-import name="Main" query="state=loggedIn" hint-size="844px,390px"></dc-import></div>
  <div class="jm-scrim"></div>

  <sc-if value="{{account}}" hint-placeholder-val="{{true}}">
    <section class="jm-dialog" role="dialog" aria-modal="true" aria-labelledby="acc-head">
      <div class="jm-dialog__head">
        <h1 id="acc-head" class="jm-headline">Your account</h1>
        <button type="button" class="jm-btn jm-btn--icon jm-btn--bare" aria-label="Close your account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
      </div>
      <div class="jm-setting">
        <div class="jm-setting__text">
          <h2 class="jm-label">Your name</h2>
          <span class="jm-setting__value">Mara</span>
          <span class="jm-caption">Logged in with Spotify.</span>
        </div>
        <button type="button" class="jm-btn">Change</button>
      </div>
      <button type="button" class="jm-btn jm-btn--nav">Sign out <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg></button>
      <button type="button" class="jm-btn jm-btn--danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Delete my account</button>
    </section>
  </sc-if>

  <sc-if value="{{remove}}" hint-placeholder-val="{{false}}">
    <section class="jm-dialog" role="dialog" aria-modal="true" aria-labelledby="del-head">
      <div class="jm-dialog__head">
        <h1 id="del-head" class="jm-headline">Delete your account?</h1>
        <button type="button" class="jm-btn jm-btn--icon jm-btn--bare" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
      </div>
      <p class="jm-meta">This removes your Jamster account and all imported data. Your Spotify account will not be touched.</p>
      <div class="jm-pair" style="margin-top: 6px">
        <button type="button" class="jm-btn">Cancel</button>
        <button type="button" class="jm-btn jm-btn--primary">Delete my account</button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"popup":{"editor":"enum","options":["account","delete"],"default":"account"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.popup ?? "account";
    // Change your name is the same name pop-up as adding a local player: see AddPlayer.
    return { account: p === "account", remove: p === "delete" };
  }
}
</script>
</body>
</html>
