<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jamster – game settings, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/jamster/tokens.css">
<link rel="stylesheet" href="ds/jamster/components/bundle.css">
<link rel="stylesheet" href="ds/jamster/components/desktop.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.dk-header .jm-headline{font-size:28px;line-height:32px}
.dk-frame .jm-caption{font-size:14px;line-height:20px}
.dk-frame .jm-btn{min-height:50px;padding:0 20px;font-size:16px}
.dk-frame .jm-btn svg{width:20px;height:20px}
.dk-frame .jm-btn--icon{width:50px;height:50px;padding:0}
.dk-frame .jm-btn--toggle{padding:0 14px}
/* The deck mix: every card at once, sharing the column's width; they wrap below 204px each. */
.settings-mix{display:flex;flex-direction:column;gap:12px}
.settings-mix__head{display:flex;align-items:baseline;gap:12px}
.settings-mix .jm-section{font-size:20px;line-height:24px}
.settings-mix__row{display:grid;grid-template-columns:repeat(auto-fit,minmax(204px,1fr));gap:16px;margin:0;padding:0;list-style:none}
/* The other settings, as on the phone with more room (the frontend's .jm-desktop rules in Settings.css). */
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,auto);grid-auto-flow:column;column-gap:clamp(32px,32px + 24 * var(--dk),65px)}
.settings-row{display:flex;align-items:center;gap:16px;min-height:96px;box-sizing:border-box;padding:16px 0;border-bottom:2px solid var(--sand-line)}
.settings-row.is-last{border-bottom:0}
.settings-row .jm-setting__text{gap:4px}
.settings-row .jm-section{font-size:18px;line-height:23px}
.settings-row .jm-stepper{gap:8px}
.settings-row .jm-stepper__value{min-width:56px;font-size:28px}
.settings-value{flex:0 0 auto;font:800 28px/1 var(--font-ui);font-variant-numeric:tabular-nums}
</style>
</helmet>
<main class="dk-screen">
<div class="dk-frame">
  <header class="dk-header">
    <a href="DesktopLobby.dc.html" class="jm-btn jm-btn--icon" aria-label="Back to the lobby"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 class="jm-headline">Game settings</h1>
    <span class="jm-header__spacer"></span>
    <sc-if value="{{guest}}" hint-placeholder-val="{{false}}"><span class="jm-caption">The host sets these.</span></sc-if>
    <a href="DesktopLobby.dc.html" class="jm-btn jm-btn--primary" style="min-width: 120px">Done</a>
  </header>

  <section class="settings-mix" aria-labelledby="dk-s-mix">
    <div class="settings-mix__head">
      <h2 id="dk-s-mix" class="jm-section">Deck mix</h2>
      <span class="jm-caption">How the songs are picked from your libraries.</span>
    </div>
    <ul class="settings-mix__row" aria-labelledby="dk-s-mix">
      <sc-for list="{{mixes}}" as="m" hint-placeholder-count="5">
        <li class="jm-mix-card {{m.cls}}" aria-current="{{m.current}}">
          <span class="jm-mix-card__art">
            <sc-if value="{{m.isBalanced}}" hint-placeholder-val="{{false}}">
              <svg class="jm-mix-art" viewBox="0 0 120 72" aria-hidden="true">
                <path class="a-line-subtle" d="M14 64H106" stroke-width="1.8"></path>
                <path class="a-mustard" d="M60 44 49 63H71Z" stroke-width="2.2"></path>
                <rect class="a-label" x="10" y="39" width="100" height="5" rx="2.5" stroke-width="2.2"></rect>
                <rect class="a-coral" x="15" y="16" width="36" height="23" rx="3" stroke-width="2"></rect>
                <rect class="a-label" x="19" y="19" width="28" height="8" rx="1.5" stroke-width="1.4"></rect>
                <rect class="a-window" x="24" y="30" width="18" height="6" rx="3"></rect>
                <circle class="a-label" cx="28" cy="33" r="2"></circle>
                <circle class="a-label" cx="38" cy="33" r="2"></circle>
                <rect class="a-coral" x="69" y="16" width="36" height="23" rx="3" stroke-width="2"></rect>
                <rect class="a-label" x="73" y="19" width="28" height="8" rx="1.5" stroke-width="1.4"></rect>
                <rect class="a-window" x="78" y="30" width="18" height="6" rx="3"></rect>
                <circle class="a-label" cx="82" cy="33" r="2"></circle>
                <circle class="a-label" cx="92" cy="33" r="2"></circle>
              </svg>
            </sc-if>
            <sc-if value="{{m.isShowAndTell}}" hint-placeholder-val="{{false}}">
              <svg class="jm-mix-art" viewBox="0 0 120 72" aria-hidden="true">
                <path d="M38 12 31 8M37 22H29M82 12 89 8M83 22H91" stroke-width="2"></path>
                <rect class="a-mustard" x="46" y="4" width="28" height="38" rx="4" stroke-width="2.2"></rect>
                <circle class="a-coral" cx="60" cy="15" r="4.5" stroke-width="1.8"></circle>
                <path d="M53 25H67M55 30H65" stroke-width="1.8"></path>
                <path class="a-label" d="M51 48 49 72H71L69 48Z" stroke-width="2.2"></path>
                <path class="a-coral" d="M49.5 62 49 72H71L70.5 62Z" stroke-width="2.2"></path>
                <rect class="a-label" x="47" y="34" width="26" height="16" rx="6" stroke-width="2.2"></rect>
                <path d="M53.5 35V41M60 35V41M66.5 35V41" stroke-width="1.6"></path>
                <path d="M47.5 44C43 43 42 38 44 34" stroke-width="2"></path>
              </svg>
            </sc-if>
            <sc-if value="{{m.isWildcards}}" hint-placeholder-val="{{false}}">
              <svg class="jm-mix-art" viewBox="0 0 120 72" aria-hidden="true">
                <g transform="rotate(-12 50 38)">
                  <rect class="a-coral" x="31" y="10" width="38" height="54" rx="5" stroke-width="2.2"></rect>
                  <rect x="36" y="15" width="28" height="44" rx="3" stroke-width="1.4" stroke-dasharray="2 3"></rect>
                </g>
                <g transform="rotate(9 66 37)">
                  <rect class="a-label" x="47" y="8" width="38" height="56" rx="5" stroke-width="2.2"></rect>
                  <path class="a-mustard" d="M54 44 56.5 23 62.5 34 66 18 69.5 34 75.5 23 78 44Z" stroke-width="2"></path>
                  <rect class="a-coral" x="52.5" y="43" width="27" height="6" rx="2" stroke-width="1.8"></rect>
                  <circle class="a-coral" cx="56.5" cy="22" r="2.6" stroke-width="1.4"></circle>
                  <circle class="a-coral" cx="66" cy="17" r="2.6" stroke-width="1.4"></circle>
                  <circle class="a-coral" cx="75.5" cy="22" r="2.6" stroke-width="1.4"></circle>
                  <path d="M52 56H58M74 56H80" stroke-width="1.6"></path>
                </g>
                <path d="M101 9V21M95 15H107" stroke-width="2.2"></path>
                <path d="M17 50V58M13 54H21" stroke-width="2"></path>
              </svg>
            </sc-if>
            <sc-if value="{{m.isDeepDive}}" hint-placeholder-val="{{false}}">
              <svg class="jm-mix-art" viewBox="0 0 120 72" aria-hidden="true">
                <path class="a-coral" d="M34 70C34 54 46 47 60 47 74 47 86 54 86 70Z" stroke-width="2.2"></path>
                <circle class="a-mustard" cx="60" cy="27" r="15" stroke-width="2.2"></circle>
                <path d="M54.5 22.5A5.5 5.5 0 1 1 62.5 27.5C60.5 28.5 60 30 60 32" stroke-width="2.8"></path>
                <circle class="a-ink" cx="60" cy="37" r="1.8"></circle>
                <path class="a-mustard" d="M22 11 24.1 15.9 29 18 24.1 20.1 22 25 19.9 20.1 15 18 19.9 15.9Z" stroke-width="1.6"></path>
                <path class="a-label" d="M98 8 99.8 12.2 104 14 99.8 15.8 98 20 96.2 15.8 92 14 96.2 12.2Z" stroke-width="1.6"></path>
                <path class="a-mustard" d="M104 35.5 105.35 38.65 108.5 40 105.35 41.35 104 44.5 102.65 41.35 99.5 40 102.65 38.65Z" stroke-width="1.4"></path>
                <path class="a-label" d="M16 39.5 17.35 42.65 20.5 44 17.35 45.35 16 48.5 14.65 45.35 11.5 44 14.65 42.65Z" stroke-width="1.4"></path>
              </svg>
            </sc-if>
            <sc-if value="{{m.isNostalgia}}" hint-placeholder-val="{{false}}">
              <svg class="jm-mix-art" viewBox="0 0 120 72" aria-hidden="true">
                <rect class="a-coral" x="20" y="12" width="80" height="52" rx="6" stroke-width="2.4"></rect>
                <rect class="a-sand" x="28" y="18" width="64" height="21" rx="3" stroke-width="1.6"></rect>
                <path class="a-line-subtle" d="M34 25Q38 22 42 25T50 25 58 25" stroke-width="1.6"></path>
                <text class="a-muted" x="54" y="35" font-size="8">2009</text>
                <rect class="a-window" x="40" y="44" width="40" height="12" rx="6"></rect>
                <circle class="a-label" cx="50" cy="50" r="4" stroke-width="1.4"></circle>
                <circle class="a-label" cx="70" cy="50" r="4" stroke-width="1.4"></circle>
                <path d="M99 13L73 13M99 13L75.4 24M99 13L82.3 32.9M99 13L92.3 38.1M99 13L99 39M91 13Q92.6 14.4 91.7 16.4Q93.8 17 93.9 19.1Q96 18.8 96.9 20.7Q98.1 19.5 99 21M84 13Q87 15.7 85.4 19.3Q89.2 20.5 89.4 24.5Q93.3 23.9 95.1 27.5Q97.4 25.2 99 28M76 13Q80.6 17.1 78.2 22.7Q84 24.5 84.2 30.6Q90.3 29.7 93 35.2Q96.5 31.7 99 36" stroke-width="1.5"></path>
                <circle class="a-label" cx="26" cy="48" r="1.1"></circle>
                <circle class="a-label" cx="32" cy="58" r="1.3"></circle>
                <circle class="a-label" cx="88" cy="50" r="1.1"></circle>
                <circle class="a-label" cx="93" cy="58" r="1.3"></circle>
                <circle class="a-label" cx="84" cy="60" r="1"></circle>
                <circle class="a-subtle" cx="14" cy="22" r="1.4"></circle>
                <circle class="a-subtle" cx="10" cy="34" r="1"></circle>
                <circle class="a-subtle" cx="108" cy="50" r="1.2"></circle>
              </svg>
            </sc-if>
            <span class="jm-mix-card__tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"></path></svg></span>
          </span>
          <span class="jm-mix-card__text">
            <span class="jm-mix-card__name">
              <sc-if value="{{host}}" hint-placeholder-val="{{true}}"><button type="button" class="jm-mix-card__pick" aria-pressed="{{m.pressed}}" disabled="{{m.planned}}" onClick="{{m.pick}}">{{m.name}}</button></sc-if>
              <sc-if value="{{guest}}" hint-placeholder-val="{{false}}"><span>{{m.name}}</span></sc-if>
              <sc-if value="{{m.planned}}" hint-placeholder-val="{{false}}"><span class="jm-mix-card__soon">Soon</span></sc-if>
            </span>
            <span class="jm-mix-card__line">{{m.line}}</span>
          </span>
        </li>
      </sc-for>
    </ul>
  </section>

  <div class="settings-grid">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div class="settings-row {{r.cls}}">
        <div class="jm-setting__text">
          <span id="{{r.id}}" class="jm-section">{{r.name}}</span>
          <span class="jm-caption">{{r.caption}}</span>
        </div>
        <sc-if value="{{r.stepper}}" hint-placeholder-val="{{true}}">
          <div class="jm-stepper" role="group" aria-labelledby="{{r.id}}">
            <button type="button" class="jm-btn jm-btn--icon" aria-label="{{r.less}}" disabled="{{r.atMin}}" onClick="{{r.dec}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <output class="jm-stepper__value">{{r.value}}</output>
            <button type="button" class="jm-btn jm-btn--icon" aria-label="{{r.more}}" disabled="{{r.atMax}}" onClick="{{r.inc}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
          </div>
        </sc-if>
        <sc-if value="{{r.segmented}}" hint-placeholder-val="{{false}}">
          <div class="jm-segmented" role="group" aria-labelledby="{{r.id}}">
            <sc-for list="{{r.options}}" as="o" hint-placeholder-count="4">
              <button type="button" class="jm-btn jm-btn--toggle" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{r.readOnly}}" hint-placeholder-val="{{false}}">
          <output class="settings-value" aria-labelledby="{{r.id}}">{{r.shown}}</output>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["host","guest"],"default":"host"},"mix":{"editor":"enum","options":["balanced","show_and_tell","wildcards"],"default":"balanced"},"planned":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { win: 10, tokens: 3, deck: 100, challenge: 10, next: 15, mix: null }; }
  renderVals() {
    const host = (this.props.role ?? "host") === "host";
    const st = this.state;
    // The deck mixes: the three built ones, then the two planned ones (shown as Soon until they exist).
    const MIXES = [
      ["balanced", "Balanced", "Songs you all know, a fair share from every library.", "isBalanced"],
      ["show_and_tell", "Show & Tell", "Everyone brings the songs only they know.", "isShowAndTell"],
      ["wildcards", "Wildcards", "Obscure picks. Good luck.", "isWildcards"],
      ["deep_dive", "Deep Dive", "A single artist, start to finish.", "isDeepDive", true],
      ["nostalgia", "Nostalgia", "Songs you loved years ago.", "isNostalgia", true]
    ];
    const picked = st.mix ?? this.props.mix ?? "balanced";
    const showPlanned = this.props.planned ?? true;
    const mixes = MIXES.filter((x) => showPlanned || !x[4]).map(([key, name, line, flag, planned]) => {
      const on = !planned && key === picked;
      const m = {
        name, line, planned: !!planned,
        cls: on ? "jm-mix-card--picked" : planned ? "jm-mix-card--planned" : "",
        current: String(on), pressed: String(on),
        pick: () => this.setState({ mix: key }),
        isBalanced: false, isShowAndTell: false, isWildcards: false, isDeepDive: false, isNostalgia: false
      };
      m[flag] = true;
      return m;
    });
    const set = (k, v) => () => this.setState({ [k]: v });
    const stepper = (id, key, name, caption, step, min, max, less, more, cls) => ({
      id, name, caption, cls, stepper: host, readOnly: !host, shown: st[key], value: st[key], less, more,
      atMin: st[key] - step < min, atMax: st[key] + step > max,
      dec: set(key, st[key] - step), inc: set(key, st[key] + step)
    });
    const seg = (id, key, name, caption, opts, cls) => ({
      id, name, caption, cls, segmented: host, readOnly: !host,
      shown: (opts.find((o) => o[1] === st[key]) || [""])[0],
      options: opts.map(([label, value]) => ({ label, pressed: String(value === st[key]), pick: set(key, value) }))
    });
    // Two columns, filled top to bottom: the game's numbers, then its timers.
    const rows = [
      stepper("dk-s-win", "win", "Cards to win", "First to this many wins.", 1, 3, 20, "Fewer cards", "More cards", ""),
      stepper("dk-s-tokens", "tokens", "Starting tokens", "For challenges and skips. Three buy a card.", 1, 0, 5, "Fewer tokens", "More tokens", ""),
      stepper("dk-s-deck", "deck", "Deck size", "Picked from 3,402 songs in 2 libraries.", 10, 20, 300, "Smaller deck", "Bigger deck", "is-last"),
      seg("dk-s-challenge", "challenge", "Time to challenge", "After the placement is locked in.", [["5 s", 5], ["10 s", 10], ["15 s", 15], ["20 s", 20]], ""),
      seg("dk-s-next", "next", "Next song starts", "After the reveal. Click: only when someone clicks Next song.", [["5 s", 5], ["10 s", 10], ["15 s", 15], ["Click", 0]], "is-last")
    ];
    return { host, guest: !host, mixes, rows };
  }
}
</script>
</body>
</html>
