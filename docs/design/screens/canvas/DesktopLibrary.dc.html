<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jamster – your songs, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/jamster/tokens.css">
<link rel="stylesheet" href="ds/jamster/components/bundle.css">
<link rel="stylesheet" href="ds/jamster/components/desktop.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.dk-header .jm-headline{font-size:28px;line-height:32px}
.dk-frame .jm-caption{font-size:14px;line-height:20px}
.dk-frame .jm-btn{min-height:50px;padding:0 20px;font-size:16px}
.dk-frame .jm-btn svg{width:20px;height:20px}
.dk-frame .jm-btn--icon{width:52px;height:52px;padding:0}
.dk-list{flex:1;min-height:0;padding:26px 30px 22px;border-radius:22px;display:flex;flex-direction:column;gap:16px}
.dk-list .jm-section{font-size:20px;line-height:24px}
.dk-list .jm-search>input{height:50px;padding-left:44px;font-size:16px}
.dk-list .jm-search>svg{left:16px;width:20px;height:20px}
.dk-list .jm-check-row{min-height:64px;gap:16px;padding:6px 14px;border-radius:14px}
.dk-list .jm-check{width:26px;height:26px;border-radius:7px}
.dk-list .jm-check:checked::after{width:12px;height:6px}
.dk-list .jm-check-row__name{font-size:18px;line-height:23px}
.dk-list .jm-check-row__count{font-size:16px}
.dk-list .jm-progress--sm{height:10px}
@media (max-width:900px){.dk-screen{padding:24px}}
</style>
</helmet>
<main class="dk-screen">
<div class="dk-frame" style="max-width: 920px">
  <header class="dk-header">
    <a href="DesktopHome.dc.html" class="jm-btn jm-btn--icon" aria-label="Back to the start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 class="jm-headline">Your songs</h1>
    <span class="jm-header__spacer"></span>
    <span class="jm-caption">Imported 3 days ago</span>
    <button type="button" class="jm-btn" disabled="{{importing}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4.5h4.5"></path></svg>Refresh library</button>
    <a href="DesktopHome.dc.html" class="jm-btn jm-btn--primary" style="min-width: 120px">Done</a>
  </header>

  <section class="jm-panel dk-list" aria-labelledby="lib-head">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <h2 id="lib-head" class="jm-section">What goes in the deck</h2>
      <span class="jm-caption" style="margin-left: auto" aria-live="polite">{{summary}}</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div class="jm-search" style="flex: 1; min-width: 0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg><input type="search" placeholder="Search your playlists" aria-label="Search your playlists" value="{{query}}" onInput="{{onSearch}}"></div>
      <button type="button" class="jm-btn" onClick="{{selectAll}}">All</button>
      <button type="button" class="jm-btn" onClick="{{selectNone}}">None</button>
    </div>
    <div class="jm-scroll-area" style="flex: 1; margin: 0 -10px">
      <div class="jm-scroll-area__box" style="padding: 0 4px" role="group" aria-label="Library sources">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
          <label class="jm-check-row {{it.cls}}">
            <input class="jm-check" type="checkbox" checked="{{it.on}}" onChange="{{it.toggle}}">
            <span class="jm-check-row__text">
              <span class="jm-check-row__name">{{it.name}}</span>
              <sc-if value="{{it.importing}}" hint-placeholder-val="{{false}}">
                <span class="jm-caption" style="display: flex; align-items: center; gap: 10px"><span class="jm-progress jm-progress--sm" style="flex: none; width: 140px; border-width: 1.5px" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" aria-label="Importing {{it.name}}"><span style="width: 40%"></span></span>Importing…</span>
              </sc-if>
              <sc-if value="{{it.still}}" hint-placeholder-val="{{true}}">
                <span class="jm-caption">{{it.detail}}</span>
              </sc-if>
            </span>
            <span class="jm-check-row__count">{{it.count}}</span>
          </label>
        </sc-for>
        <sc-if value="{{noMatch}}" hint-placeholder-val="{{false}}">
          <p class="jm-caption" style="margin: 16px 14px">Nothing called that in your library.</p>
        </sc-if>
      </div>
      <div class="jm-scroll-area__bar" aria-hidden="true"><span style="top: 0; height: 86%"></span></div>
    </div>
  </section>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"library":{"editor":"enum","options":["picker","importing"],"default":"picker"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.library ?? "picker";
    const SOURCES = [
      { id: "liked", name: "Liked songs", kind: "Everything you've hearted", songs: 1206 },
      { id: "top", name: "Your top songs", kind: "Your most played songs", songs: 50 },
      { id: "recent", name: "Recently played", kind: "Your last 50 plays", songs: 50 },
      { id: "p1", name: "Car karaoke", kind: "Playlist", songs: 84 },
      { id: "p2", name: "90s forever", kind: "Playlist", songs: 132 },
      { id: "p3", name: "Wedding dance floor", kind: "Collaborative playlist", songs: 158 },
      { id: "p4", name: "Sunday morning", kind: "Playlist", songs: 41 },
      { id: "p5", name: "Running", kind: "Playlist", songs: 66 },
      { id: "p6", name: "Lo-fi to study to", kind: "Playlist", songs: 210 }
    ];
    const fallback = { liked: true, top: true, p1: true, p2: true, p3: true };
    const st = this.state || {};
    const sel = st.sel || fallback;
    const query = st.query || "";
    const q = query.trim().toLowerCase();
    const setSel = (next) => this.setState({ sel: next });
    const fmt = (n) => n.toLocaleString("en-US");
    const shown = SOURCES.filter((x) => !q || x.name.toLowerCase().includes(q) || x.kind.toLowerCase().includes(q));
    const items = shown.map((x) => {
      const on = !!sel[x.id];
      // While importing: the top songs are being copied (Spotify gives no count before), Car karaoke waits its turn.
      const importing = s === "importing" && x.id === "top" && on;
      return {
        name: x.name,
        on,
        importing,
        still: !importing,
        detail: s === "importing" && x.id === "p1" && on ? "Waiting to import" : x.kind,
        count: importing ? "" : fmt(x.songs),
        cls: on ? "" : "jm-check-row--off",
        toggle: () => setSel({ ...sel, [x.id]: !on })
      };
    });
    const picked = SOURCES.filter((x) => sel[x.id]);
    const songs = picked.reduce((a, x) => a + x.songs, 0);
    return {
      importing: s === "importing",
      items,
      query,
      noMatch: shown.length === 0,
      summary: picked.length + " of " + SOURCES.length + " selected, " + fmt(songs) + " songs in total",
      onSearch: (e) => this.setState({ query: e.target.value }),
      selectAll: () => setSel(Object.fromEntries(SOURCES.map((x) => [x.id, true]))),
      selectNone: () => setSel({})
    };
  }
}
</script>
</body>
</html>
