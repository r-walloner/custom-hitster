<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jamster – scoreboard</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/jamster/tokens.css">
<link rel="stylesheet" href="ds/jamster/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.st-grid{display:grid;grid-template-columns:120px 150px 44px minmax(0,1fr);gap:12px;align-items:center}
.st-row{min-height:54px;box-sizing:border-box;padding:6px 10px;border-radius:var(--radius-card);border:2px solid var(--sand-line);background:var(--paper)}
.st-row--turn{border-color:var(--ink);background:var(--turn-tint)}
</style>
</helmet>
<div class="jm-overlay" style="width: 844px; height: 390px">
  <div class="jm-overlay__under"><dc-import name="GamePlacing" query="view=watching" hint-size="844px,390px"></dc-import></div>
  <div class="jm-scrim"></div>
  <section class="jm-dialog jm-dialog--wide" style="padding: 12px 18px 16px; gap: 8px" role="dialog" aria-modal="true" aria-labelledby="st-head">
    <div class="jm-dialog__head">
      <h1 id="st-head" class="jm-headline" style="flex: 0 0 auto">Scoreboard</h1>
      <span class="jm-caption" style="flex: 1">First to 10 cards wins</span>
      <button type="button" class="jm-btn jm-btn--icon jm-btn--bare" aria-label="Close scoreboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
    </div>
    <div class="st-grid" style="padding: 0 10px" aria-hidden="true">
      <span class="jm-label" style="color: var(--ink-muted)">Player</span>
      <span class="jm-label" style="color: var(--ink-muted)">Cards</span>
      <span class="jm-label" style="color: var(--ink-muted)">Tokens</span>
      <span class="jm-label" style="color: var(--ink-muted)">Timeline</span>
    </div>
    <ul class="jm-scroll" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{players}}" as="p" hint-placeholder-count="5">
        <li class="st-grid st-row {{p.turnClass}}">
          <div style="display: flex; align-items: center; gap: 8px; min-width: 0">
            <span class="jm-avatar jm-avatar--lg {{p.color}}" aria-hidden="true">{{p.initial}}</span>
            <span class="jm-player__name">{{p.name}}<small>{{p.note}}</small></span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; font: 800 15px/1 var(--font-ui); font-variant-numeric: tabular-nums">
            <div class="jm-progress jm-progress--sm" style="flex: 1" role="progressbar" aria-valuenow="{{p.cards}}" aria-valuemin="0" aria-valuemax="10" aria-label="{{p.name}}: {{p.cards}} of 10 cards"><span style="width: {{p.pct}}"></span></div>
            <span>{{p.cards}}/10</span>
          </div>
          <span class="jm-token">{{p.tokens}}</span>
          <div class="jm-year-chips">
            <sc-for list="{{p.years}}" as="y" hint-placeholder-count="5"><span class="jm-year-chip">{{y}}</span></sc-for>
          </div>
        </li>
      </sc-for>
    </ul>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    // Best first: most cards, then most tokens. Seen from Lea's phone.
    const rows = [
      { name: "Jonas", color: "jm-p2", note: "Leading", cards: 6, tokens: 1, years: [1965, 1972, 1983, 1994, 2003, 2019] },
      { name: "Lea", color: "jm-p3", note: "That's you", cards: 5, tokens: 2, years: [1979, 1991, 2006, 2011, 2015] },
      { name: "Mara", color: "jm-p1", note: "On turn", cards: 4, tokens: 3, years: [1975, 1994, 2008, 2016], turn: true },
      { name: "Tobi", color: "jm-p4", note: "Local player", cards: 3, tokens: 2, years: [1977, 1999, 2012] },
      { name: "Sam", color: "jm-p5", note: "", cards: 2, tokens: 5, years: [1984, 2010] }
    ];
    const players = rows.map((p) => ({
      ...p,
      initial: p.name.charAt(0),
      pct: (p.cards / 10 * 100) + "%",
      turnClass: p.turn ? "st-row--turn" : ""
    }));
    return { players };
  }
}
</script>
</body>
</html>
