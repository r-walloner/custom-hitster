<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamster – game settings</title>
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components/bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.settings-row{display:flex;align-items:center;gap:12px;padding:0;border-bottom:2px solid var(--sand-line)}
.settings-row:nth-last-child(-n+2){border-bottom:0}
.settings-row .jm-setting__text{gap:1px}
.settings-value{flex:0 0 auto;font:800 22px/1 var(--font-ui);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template"><main class="jm-screen">
  <header class="jm-header">
    <a href="Lobby.dc.html" class="jm-btn jm-btn--icon" aria-label="Back to the lobby"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 class="jm-headline">Game settings</h1>
    <span class="jm-header__spacer"></span>
    <sc-if value="{{guest}}" hint-placeholder-val="{{false}}"><span class="jm-caption">The host sets these.</span></sc-if>
    <a href="Lobby.dc.html" class="jm-btn jm-btn--primary" style="min-width: 96px; font-size: 15px">Done</a>
  </header>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div class="settings-row">
        <div class="jm-setting__text">
          <span id="{{r.id}}" class="jm-section">{{r.name}}</span>
          <span class="jm-caption">{{r.caption}}</span>
        </div>
        <sc-if value="{{r.stepper}}" hint-placeholder-val="{{true}}">
          <div class="jm-stepper" role="group" aria-labelledby="{{r.id}}">
            <button type="button" class="jm-btn jm-btn--icon" aria-label="{{r.less}}" disabled="{{r.atMin}}" onClick="{{r.dec}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <output class="jm-stepper__value">{{r.value}}</output>
            <button type="button" class="jm-btn jm-btn--icon" aria-label="{{r.more}}" disabled="{{r.atMax}}" onClick="{{r.inc}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
          </div>
        </sc-if>
        <sc-if value="{{r.select}}" hint-placeholder-val="{{false}}">
          <select class="jm-select" style="width: 172px" aria-labelledby="{{r.id}}"><option>Songs most know</option></select>
        </sc-if>
        <sc-if value="{{r.segmented}}" hint-placeholder-val="{{false}}">
          <div class="jm-segmented" role="group" aria-labelledby="{{r.id}}">
            <sc-for list="{{r.options}}" as="o" hint-placeholder-count="4">
              <button type="button" class="jm-btn jm-btn--toggle" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{r.readOnly}}" hint-placeholder-val="{{false}}">
          <output class="settings-value" aria-labelledby="{{r.id}}">{{r.shown}}</output>
        </sc-if>
      </div>
    </sc-for>
  </div>
</main></template>
<script src="../../exploration/preview/dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { win: 10, tokens: 3, deck: 100, challenge: 10, next: 15 }; }
  renderVals() {
    const host = (this.props.role ?? "host") === "host";
    const st = this.state;
    const set = (k, v) => () => this.setState({ [k]: v });
    const stepper = (id, key, name, caption, step, min, max, less, more) => ({
      id, name, caption, stepper: host, readOnly: !host, shown: st[key], value: st[key], less, more,
      atMin: st[key] - step < min, atMax: st[key] + step > max,
      dec: set(key, st[key] - step), inc: set(key, st[key] + step)
    });
    const seg = (id, key, name, caption, opts) => ({
      id, name, caption, segmented: host, readOnly: !host,
      shown: (opts.find((o) => o[1] === st[key]) || [""])[0],
      options: opts.map(([label, value]) => ({ label, pressed: String(value === st[key]), pick: set(key, value) }))
    });
    const rows = [
      stepper("s-win", "win", "Cards to win", "First to this many wins.", 1, 3, 20, "Fewer cards", "More cards"),
      stepper("s-tokens", "tokens", "Starting tokens", "For challenges and skips. Three buy a card.", 1, 0, 5, "Fewer tokens", "More tokens"),
      stepper("s-deck", "deck", "Deck size", "Picked from 3,402 songs in 2 libraries.", 10, 20, 300, "Smaller deck", "Bigger deck"),
      { id: "s-strategy", name: "Deck mix", caption: "How songs are picked from each library.", select: host, readOnly: !host, shown: "Songs most know" },
      seg("s-challenge", "challenge", "Time to challenge", "After the placement is locked in.", [["5 s", 5], ["10 s", 10], ["15 s", 15], ["20 s", 20]]),
      seg("s-next", "next", "Next song starts", "After the reveal. Tap: only when someone taps Next song.", [["5 s", 5], ["10 s", 10], ["15 s", 15], ["Tap", 0]])
    ];
    return { guest: !host, rows };
  }
}
DCRuntime.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-template').content, Object.assign({"role": "host"}, Object.fromEntries(new URLSearchParams(location.search))));
</script>
</body>
</html>
