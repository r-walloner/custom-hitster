<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account and library</title>
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components/bundle.css">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lib-check{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;flex:0 0 auto;box-sizing:border-box;border:2px solid var(--ink);border-radius:6px;background:var(--label);display:grid;place-content:center;cursor:pointer}
.lib-check:checked{background:var(--ink)}
.lib-check:checked::after{content:"";width:10px;height:5px;border:solid var(--paper);border-width:0 0 2.5px 2.5px;transform:translateY(-1px) rotate(-45deg)}
.lib-check:focus-visible,.lib-search:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lib-row:hover{background:var(--paper)}
.lib-list{scrollbar-width:thin;scrollbar-color:var(--ink-subtle) var(--sand)}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template"><main class="jm-screen" style="font-family: var(--font-ui); color: var(--ink);">
  <header class="jm-header">
    <span class="jm-logo">jamster</span>
    <span class="jm-header__spacer"></span>
    <span class="jm-avatar jm-p2" style="width: 28px; height: 28px; font-size: 12px;">S</span>
    <span class="jm-header__meta"><b>Sam Keller</b><i></i>Spotify Premium</span>
    <button class="jm-btn" style="font-size: 13px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>
      Sign out
    </button>
  </header>
  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 14px; padding: 6px 0 2px;">
    <section class="jm-panel" style="min-height: 0; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 8px;" aria-labelledby="lib-head">

      <sc-if value="{{imported}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <h1 id="lib-head" class="jm-section">What goes in the deck</h1>
          <span class="jm-caption" style="margin-left: auto;" aria-live="polite">{{summary}}</span>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <div style="position: relative; flex: 1; min-width: 0;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; top: 14px; color: var(--ink-subtle);"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
            <input class="lib-search" type="search" placeholder="Search playlists and artists" aria-label="Search playlists and artists" value="{{query}}" onChange="{{onSearch}}" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px 0 34px; border: 2px solid var(--ink); border-radius: var(--radius-pill); background: var(--paper); color: var(--ink); font: 600 13px var(--font-ui);">
          </div>
          <button class="jm-btn" onClick="{{selectAll}}" style="padding: 0 12px;">All</button>
          <button class="jm-btn" onClick="{{selectNone}}" style="padding: 0 12px;">None</button>
        </div>
        <div class="lib-list" role="group" aria-label="Library sources" style="flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 2px;">
          <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
            <label class="lib-row" style="{{it.rowStyle}}">
              <input class="lib-check" type="checkbox" checked="{{it.on}}" onChange="{{it.toggle}}">
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
                <span style="{{it.nameStyle}}">{{it.name}}</span>
                <span class="jm-caption">{{it.kind}}</span>
              </span>
              <span style="font: 700 13px/1 var(--font-ui); font-variant-numeric: tabular-nums; color: var(--ink-muted);">{{it.count}}</span>
            </label>
          </sc-for>
          <sc-if value="{{noMatch}}" hint-placeholder-val="{{false}}">
            <p class="jm-caption" style="margin: 12px 6px;">Nothing called that in your library.</p>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{importing}}" hint-placeholder-val="{{false}}">
        <span class="jm-label">Your library</span>
        <h1 class="jm-moment__headline">Copying your library…</h1>
        <div style="height: 14px; box-sizing: border-box; border: 2px solid var(--ink); border-radius: var(--radius-pill); background: var(--sand); overflow: hidden;" role="progressbar" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100" aria-label="Import progress">
          <div style="width: 42%; height: 100%; background: var(--coral);"></div>
        </div>
        <p class="jm-meta" style="margin: 0;"><b style="color: var(--ink);">812 of 1,940 songs</b>, checking release years on MusicBrainz</p>
        <p class="jm-caption" style="margin: 0;">You can pick playlists once it's done. Join a game meanwhile if you like.</p>
      </sc-if>

      <sc-if value="{{none}}" hint-placeholder-val="{{false}}">
        <span class="jm-label">Your library</span>
        <h1 class="jm-moment__headline">Your library isn't in yet.</h1>
        <p class="jm-meta" style="margin: 0; max-width: 420px;">We copy your liked songs, playlists and top songs. Then you pick which ones go into the deck.</p>
        <div style="margin-top: auto; display: flex; align-items: center; gap: 12px;">
          <button class="jm-btn jm-btn--primary" style="font-size: 15px; min-width: 180px;">Import my library</button>
          <span class="jm-caption">Takes a minute or two.</span>
        </div>
      </sc-if>
    </section>

    <aside style="display: flex; flex-direction: column; gap: 10px;">
      <button class="jm-btn jm-btn--primary jm-btn--xl" style="font-size: 17px;">Host a game</button>
      <button class="jm-btn" style="width: 100%; font-size: 15px;">Join a room</button>
      <section style="margin-top: auto; padding: 12px 14px; border: 2px solid var(--sand-line); border-radius: var(--radius-card); background: var(--label); display: flex; flex-direction: column; gap: 8px;" aria-labelledby="data-head">
        <h2 id="data-head" class="jm-section">Your data</h2>
        <p class="jm-caption" style="margin: 0;">Copied 3 days ago. Deleting the copy doesn't touch your Spotify account.</p>
        <button class="jm-btn" style="width: 100%;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4.5h4.5"></path></svg>
          Re-import
        </button>
        <button class="jm-btn" style="width: 100%; color: var(--coral-text);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
          Delete my copy
        </button>
      </section>
    </aside>
  </div>
</main></template>
<script src="../../exploration/preview/dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.library ?? "imported";
    const SOURCES = [
      { id: "liked", name: "Liked songs", kind: "Everything you've hearted", songs: 1206, pinned: true },
      { id: "top", name: "Your top songs", kind: "Most played, last 6 months", songs: 50 },
      { id: "p1", name: "Car karaoke", kind: "Playlist", songs: 84 },
      { id: "p2", name: "90s forever", kind: "Playlist", songs: 132 },
      { id: "p3", name: "Wedding dance floor", kind: "Playlist", songs: 158 },
      { id: "p4", name: "Sunday morning", kind: "Playlist", songs: 41 },
      { id: "p5", name: "Running", kind: "Playlist", songs: 66 },
      { id: "p6", name: "Discover Weekly", kind: "Playlist by Spotify", songs: 30 },
      { id: "p7", name: "Lo-fi to study to", kind: "Playlist", songs: 210 },
      { id: "a1", name: "ABBA", kind: "Artist you follow", songs: 24 },
      { id: "a2", name: "Lauryn Hill", kind: "Artist you follow", songs: 12 }
    ];
    const fallback = { liked: true, top: true, p1: true, p2: true, p3: true, p4: true, p5: true, a1: true, a2: true };
    const st = this.state || {};
    const sel = st.sel || fallback;
    const query = st.query || "";
    const q = query.trim().toLowerCase();
    const setSel = (next) => this.setState({ sel: next });
    const fmt = (n) => n.toLocaleString("en-US");
    const shown = SOURCES.filter((x) => !q || x.name.toLowerCase().includes(q) || x.kind.toLowerCase().includes(q));
    const items = shown.map((x) => {
      const on = !!sel[x.id];
      return {
        ...x,
        on,
        count: fmt(x.songs),
        nameStyle: "font: " + (x.pinned ? "800" : "700") + " 14px/18px var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" + (on ? "" : " color: var(--ink-muted);"),
        rowStyle: "display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 3px 8px; box-sizing: border-box; border-radius: var(--radius-card); cursor: pointer;" + (x.pinned ? " border-bottom: 2px solid var(--sand-line); border-radius: var(--radius-card) var(--radius-card) 0 0; margin-bottom: 2px;" : ""),
        toggle: () => setSel({ ...sel, [x.id]: !on })
      };
    });
    const picked = SOURCES.filter((x) => sel[x.id]);
    const songs = picked.reduce((a, x) => a + x.songs, 0);
    return {
      imported: s === "imported",
      importing: s === "importing",
      none: s === "none",
      items,
      query,
      noMatch: shown.length === 0,
      summary: picked.length + " of " + SOURCES.length + " picked, up to " + fmt(songs) + " songs",
      onSearch: (e) => this.setState({ query: e.target.value }),
      selectAll: () => setSel(Object.fromEntries(SOURCES.map((x) => [x.id, true]))),
      selectNone: () => setSel({})
    };
  }
}
DCRuntime.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-template').content, {"library": "imported"});
</script>
</body>
</html>
