<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamster – action feedback</title>
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components/bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template"><main class="jm-screen" style="padding: 18px 24px; gap: 12px">
  <div style="display: flex; align-items: baseline; gap: 12px">
    <h1 class="jm-headline">Action feedback</h1>
    <span class="jm-caption">One at a time, bottom centre. Gone after 4 seconds.</span>
  </div>
  <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; align-content: start">
    <div style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1">
      <span class="jm-label">Music didn't start, with an action</span>
      <div class="jm-toast jm-toast--action" role="alert">
        <span class="jm-toast__badge jm-toast__badge--wrong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M16 9l5 6M21 9l-5 6"></path></svg></span>
        <span class="jm-toast__text">Sam's music didn't start. No Spotify device found. Open Spotify on a device and choose it here.</span>
        <button type="button" class="jm-btn jm-btn--primary">Retry</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span class="jm-label">Refused by the server</span>
      <div class="jm-toast" role="status">
        <span class="jm-toast__badge jm-toast__badge--wrong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
        <span class="jm-toast__text">It is not your turn</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span class="jm-label">Offline</span>
      <div class="jm-toast" role="status">
        <span class="jm-toast__badge jm-toast__badge--wrong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
        <span class="jm-toast__text">Not connected. Reconnecting…</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span class="jm-label">Heads-up</span>
      <div class="jm-toast" role="status">
        <span class="jm-toast__badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11v6"></path><path d="M12 7.5h.01"></path></svg></span>
        <span class="jm-toast__text">Lea is away. The seat is kept for them.</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span class="jm-label">Failed on this device</span>
      <div class="jm-toast" role="status">
        <span class="jm-toast__badge jm-toast__badge--wrong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
        <span class="jm-toast__text">Couldn't copy the link. Share the code instead.</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span class="jm-label">Small wins</span>
      <div class="jm-toast" role="status">
        <span class="jm-toast__badge jm-toast__badge--right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
        <span class="jm-toast__text">Invite link copied.</span>
      </div>
    </div>
  </div>
</main></template>
<script src="../../exploration/preview/dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
DCRuntime.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-template').content, Object.assign({}, Object.fromEntries(new URLSearchParams(location.search))));
</script>
</body>
</html>
