<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game menu</title>
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components/bundle.css">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template"><div style="position: relative; width: 844px; height: 390px; overflow: hidden; font-family: var(--font-ui); color: var(--ink); background: var(--paper);">
  <div style="position: relative; z-index: 0;"><iframe src="GamePlacing.html" title="GamePlacing" tabindex="-1" aria-hidden="true" style="display: block; width: 844px; height: 390px; border: 0;"></iframe></div>
  <div style="position: absolute; inset: 0; background: rgba(42, 33, 28, 0.55);"></div>
  <section class="jm-panel" role="dialog" aria-modal="true" aria-labelledby="menu-head" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 380px; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-sticker-lg);">
    <div style="display: flex; align-items: center; gap: 8px;">
      <h1 id="menu-head" class="jm-headline" style="flex: 1;">Menu</h1>
      <button class="jm-btn jm-btn--icon" aria-label="Close menu" style="border-color: transparent; background: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>
      </button>
    </div>

    <section style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 2px solid var(--sand-line); border-bottom: 2px solid var(--sand-line);" aria-labelledby="music-h">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <h2 id="music-h" class="jm-label">Music plays on</h2>
        <span class="jm-section">Living room TV</span>
      </div>
      <a href="Playback.dc.html" class="jm-btn" style="text-decoration: none;">Change</a>
    </section>

    <a href="Standings.dc.html" class="jm-btn" style="text-decoration: none; justify-content: space-between;">
      Scoreboard
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
    <button class="jm-btn jm-btn--dark" style="margin-top: 4px;">End game</button>
  </section>
</div></template>
<script src="../../exploration/preview/dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
DCRuntime.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-template').content, {});
</script>
</body>
</html>
