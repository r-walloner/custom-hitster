<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamster game screen – reveal and result</title>
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components/bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template"><div class="jm-screen" style="font-family: var(--font-ui); color: #2a211c">
  <header class="jm-header">
    <span class="jm-logo">jamster</span>
    <span class="jm-chip" aria-label="Room code QZRK">QZRK</span>
    <span class="jm-header__meta">Turn <b>7</b><i></i><b>38</b> cards left<i></i>First to <b>10</b></span>
    <span style="flex: 1"></span>
    <button type="button" class="jm-btn jm-btn--square" aria-label="Game menu: settings, playback device, players, end game"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
  </header>

  <div class="jm-screen__top">
    <div class="jm-tape-player">
      <div class="jm-tape jm-tape--bounce is-playing"><div class="jm-tape__bob"><div class="jm-tape__shell">
        <svg viewBox="0 0 300 190" width="160" height="101" role="progressbar" aria-label="Song progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70">
          <rect class="t-shell" x="4" y="4" width="292" height="182" rx="18" stroke-width="7"></rect>
          <circle class="t-ink" cx="17" cy="17" r="4.5"></circle><circle class="t-ink" cx="283" cy="17" r="4.5"></circle><circle class="t-ink" cx="17" cy="173" r="4.5"></circle><circle class="t-ink" cx="283" cy="173" r="4.5"></circle>
          <rect class="t-window" x="92" y="70" width="116" height="40" rx="20"></rect>
          <circle class="t-pack" cx="105" cy="90" r="36" style="transform: scale(0.58)"></circle>
          <circle class="t-pack" cx="195" cy="90" r="36" style="transform: scale(0.82)"></circle>
          <g class="t-reel"><circle class="t-hub" cx="105" cy="90" r="13" stroke-width="4"></circle><path class="t-spoke" d="M105 80v20M96.3 85l17.4 10M96.3 95l17.4-10" stroke-width="4"></path></g>
          <g class="t-reel"><circle class="t-hub" cx="195" cy="90" r="13" stroke-width="4"></circle><path class="t-spoke" d="M195 80v20M186.3 85l17.4 10M186.3 95l17.4-10" stroke-width="4"></path></g>
          <path class="t-label" fill-rule="evenodd" stroke-width="5" d="M30 18H270A8 8 0 0 1 278 26V138A8 8 0 0 1 270 146H30A8 8 0 0 1 22 138V26A8 8 0 0 1 30 18Z M92 70H208A20 20 0 0 1 208 110H92A20 20 0 0 1 92 70Z"></path>
          <text class="t-year" x="150" y="60" text-anchor="middle">1995</text>
          <rect class="t-track" x="40" y="122" width="220" height="11" rx="5.5"></rect>
          <rect class="t-bar" x="40" y="122" width="154" height="11" rx="5.5"></rect>
          <path class="t-foot" stroke-width="5" d="M78 186L90 156H210L222 186"></path>
          <circle class="t-ink" cx="112" cy="174" r="6"></circle><circle class="t-ink" cx="188" cy="174" r="6"></circle>
        </svg>
      </div></div></div>
      <div class="jm-tape__foot"><span class="jm-time">0:21 / 0:30</span><button type="button" class="jm-btn jm-btn--icon-sm" aria-label="Restart the song from the beginning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button></div>
    </div>

    <section class="jm-panel jm-moment" style="padding: 10px 12px 12px" aria-label="Round result">
      <div class="jm-result">
        <div class="jm-song" style="width: 156px">
          <span class="jm-label">The song</span>
          <span class="jm-song__title">Wonderwall</span>
          <span class="jm-song__artist">Oasis</span>
          <span class="jm-song__library"><span class="jm-avatar jm-p2">J</span><span>From Jonas's library<small>Year: original release, MusicBrainz</small></span></span>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; gap: 8px"><span class="jm-verdict"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Right</span><h1 class="jm-moment__headline" style="font-size: 20px; flex: 1; min-width: 0">Mara nailed it.</h1><div class="jm-ring" style="--p: 40; width: 44px; height: 44px; flex: 0 0 auto" role="timer" aria-label="Next song in 6 seconds"><span style="width: 32px; height: 32px; font-size: 16px">6</span></div></div>
          <div style="display: flex; align-items: center; gap: 8px">
            <span class="jm-moment__sub" style="flex: 1; min-width: 0">Card is hers. Jonas and Sam missed.</span>
            <button type="button" class="jm-btn jm-btn--toggle" aria-pressed="{{namedPressed}}" onClick="{{toggleNamed}}">
              <sc-if value="{{named}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if>
              Named it · +<span class="jm-token" style="font-size: 14px">1</span>
            </button>
          </div>
          <div style="display: flex; gap: 8px; margin-top: auto">
            <button type="button" class="jm-btn jm-btn--lg">Keep listening</button>
            <button type="button" class="jm-btn jm-btn--primary jm-btn--next" style="min-height: 50px" aria-label="Next song, starts by itself in 6 seconds"><span style="display: inline-flex; align-items: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l10 7-10 7z" fill="currentColor"></path><path d="M19 5v14"></path></svg>Next song</span></button>
          </div>
        </div>
      </div>
    </section>

    <aside class="jm-scoreboard" aria-label="Standings">
      <div class="jm-scoreboard__row jm-scoreboard__row--turn" aria-label="{{maraAria}}"><span class="jm-avatar jm-p1">M</span><span class="jm-scoreboard__score">5</span><span class="jm-token">{{maraTokens}}</span></div>
      <div class="jm-scoreboard__row" aria-label="Jonas: 6 cards, 0 tokens"><span class="jm-avatar jm-p2">J</span><span class="jm-scoreboard__score">6</span><span class="jm-token">0</span></div>
      <div class="jm-scoreboard__row" aria-label="Lea: 5 cards, 2 tokens"><span class="jm-avatar jm-p3">L</span><span class="jm-scoreboard__score">5</span><span class="jm-token">2</span></div>
      <div class="jm-scoreboard__row" aria-label="Tobi: 3 cards, 2 tokens"><span class="jm-avatar jm-p4">T</span><span class="jm-scoreboard__score">3</span><span class="jm-token">2</span></div>
      <div class="jm-scoreboard__row" aria-label="Sam: 2 cards, 4 tokens"><span class="jm-avatar jm-p5">S</span><span class="jm-scoreboard__score">2</span><span class="jm-token">4</span></div>
    </aside>
  </div>

  <section class="jm-board" aria-label="Mara's timeline, with everyone's guesses">
    <div class="jm-board__head"><h2 class="jm-section">Mara's timeline</h2><span class="jm-meta" style="font-size: 12px">5 of 10</span></div>
    <div class="jm-board__row" style="gap: 10px; padding-top: 14px">
      <div class="jm-card"><span class="jm-card__year">1975</span><span class="jm-card__title">Bohemian Rhapsody</span><span class="jm-card__artist">Queen</span><span class="jm-mark jm-mark--wrong" role="img" aria-label="Jonas guessed between 1975 and 1994: wrong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>J</span></div>
      <div class="jm-card"><span class="jm-card__year">1994</span><span class="jm-card__title">Zombie</span><span class="jm-card__artist">The Cranberries</span></div>
      <div class="jm-card jm-card--new"><span class="jm-mark jm-mark--right" role="img" aria-label="Mara placed it here: right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>M</span><span class="jm-card__year">1995</span><span class="jm-card__title">Wonderwall</span><span class="jm-card__artist">Oasis</span></div>
      <div class="jm-card"><span class="jm-card__year">2008</span><span class="jm-card__title">Viva la Vida</span><span class="jm-card__artist">Coldplay</span><span class="jm-mark jm-mark--wrong" role="img" aria-label="Sam guessed between 2008 and 2016: wrong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>S</span></div>
      <div class="jm-card"><span class="jm-card__year">2016</span><span class="jm-card__title">Redbone</span><span class="jm-card__artist">Childish Gambino</span></div>
    </div>
  </section>
</div></template>
<script src="../../exploration/preview/dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { named: false }; }
  renderVals() {
    const named = this.state.named;
    const tokens = 3 + (named ? 1 : 0);
    return {
      named,
      namedPressed: named ? 'true' : 'false',
      toggleNamed: () => this.setState({ named: !named }),
      maraTokens: tokens,
      maraAria: 'Mara: 5 cards, ' + tokens + ' tokens'
    };
  }
}
DCRuntime.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-template').content, {});
</script>
</body>
</html>
