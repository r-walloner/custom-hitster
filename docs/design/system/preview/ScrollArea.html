<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<meta charset="utf-8"><title>ScrollArea — preview</title></head>
<body>
<div class="jm-stage" style="align-items: flex-start">
  <div class="jm-panel" style="width: 300px; height: 190px; padding: 4px 6px 4px 12px; display: flex; flex-direction: column">
    <div class="jm-scroll-area" style="flex: 1">
      <div class="jm-scroll-area__box" style="padding-right: 6px">
        <div class="jm-setting"><div class="jm-setting__text"><span class="jm-label">Music plays on</span><span class="jm-setting__value">Living room TV</span></div><button type="button" class="jm-btn">Change</button></div>
        <div class="jm-setting"><div class="jm-setting__text"><span class="jm-label">Your songs</span><span class="jm-setting__value">1,940 songs</span></div><button type="button" class="jm-btn">Change</button></div>
        <div class="jm-setting"><div class="jm-setting__text"><span class="jm-label">Rules</span><span class="jm-setting__value">First to 10 cards</span></div><button type="button" class="jm-btn">Change</button></div>
      </div>
      <div class="jm-scroll-area__bar" aria-hidden="true"><span style="top: 0; height: 82%"></span></div>
    </div>
  </div>
</div>
</body>
</html>
