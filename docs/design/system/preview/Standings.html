<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<meta charset="utf-8"><title>Standings — preview</title></head>
<body>
<div style="padding: 16px">
  <aside class="jm-panel jm-standings" aria-label="Standings">
    <h2 class="jm-section" style="margin: 0 0 2px 4px">Standings</h2>
    <div class="jm-standing jm-standing--turn jm-p1">
      <div class="jm-standing__row"><span class="jm-avatar jm-avatar--sm jm-p1">M</span><span class="jm-standing__name">Mara</span><span class="jm-token" aria-label="2 tokens">2</span><span class="jm-score">4<small>/10</small></span></div>
      <div class="jm-slots" aria-hidden="true"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="jm-standing jm-p2">
      <div class="jm-standing__row"><span class="jm-avatar jm-avatar--sm jm-p2">J</span><span class="jm-standing__name">Jonas</span><span class="jm-token" aria-label="1 token">1</span><span class="jm-score">6<small>/10</small></span></div>
      <div class="jm-slots" aria-hidden="true"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="jm-standing jm-p3">
      <div class="jm-standing__row"><span class="jm-avatar jm-avatar--sm jm-p3">L</span><span class="jm-standing__name">Lea</span><span class="jm-token" aria-label="3 tokens">3</span><span class="jm-score">5<small>/10</small></span></div>
      <div class="jm-slots" aria-hidden="true"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="jm-standing jm-p4">
      <div class="jm-standing__row"><span class="jm-avatar jm-avatar--sm jm-p4">T</span><span class="jm-standing__name">Tobi</span><span class="jm-token" aria-label="2 tokens">2</span><span class="jm-score">3<small>/10</small></span></div>
      <div class="jm-slots" aria-hidden="true"><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="jm-standing jm-p5">
      <div class="jm-standing__row"><span class="jm-avatar jm-avatar--sm jm-p5">S</span><span class="jm-standing__name">Sam</span><span class="jm-token" aria-label="4 tokens">4</span><span class="jm-score">2<small>/10</small></span></div>
      <div class="jm-slots" aria-hidden="true"><span class="on"></span><span class="on"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </aside>
</div>
</body>
</html>
