<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<meta charset="utf-8"><title>GameScreen — preview</title></head>
<body>
<div class="jm-screen">
  <header class="jm-header">
    <span class="jm-logo">jamster</span>
    <span class="jm-chip" aria-label="Room code QZRK">QZRK</span>
    <span class="jm-header__meta">Turn <b>7</b><i></i><b>38</b> cards left<i></i>First to <b>10</b></span>
    <span class="jm-header__spacer"></span>
    <button type="button" class="jm-btn jm-btn--square" aria-label="Game menu: settings, playback device, players, end game"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
  </header>
  <div class="jm-screen__top">
    <div class="jm-tape-player">
      <div class="jm-tape jm-tape--bounce is-playing"><div class="jm-tape__bob"><div class="jm-tape__shell">
        <svg viewBox="0 0 300 190" width="160" height="101" role="progressbar" aria-label="Song progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30">
          <rect class="t-shell" x="4" y="4" width="292" height="182" rx="18" stroke-width="7"></rect>
          <circle class="t-ink" cx="17" cy="17" r="4.5"></circle><circle class="t-ink" cx="283" cy="17" r="4.5"></circle><circle class="t-ink" cx="17" cy="173" r="4.5"></circle><circle class="t-ink" cx="283" cy="173" r="4.5"></circle>
          <rect class="t-window" x="92" y="70" width="116" height="40" rx="20"></rect>
          <circle class="t-pack" cx="105" cy="90" r="36" style="transform: scale(0.82)"></circle>
          <circle class="t-pack" cx="195" cy="90" r="36" style="transform: scale(0.58)"></circle>
          <g class="t-reel"><circle class="t-hub" cx="105" cy="90" r="13" stroke-width="4"></circle><path class="t-spoke" d="M105 80v20M96.3 85l17.4 10M96.3 95l17.4-10" stroke-width="4"></path></g>
          <g class="t-reel"><circle class="t-hub" cx="195" cy="90" r="13" stroke-width="4"></circle><path class="t-spoke" d="M195 80v20M186.3 85l17.4 10M186.3 95l17.4-10" stroke-width="4"></path></g>
          <path class="t-label" fill-rule="evenodd" stroke-width="5" d="M30 18H270A8 8 0 0 1 278 26V138A8 8 0 0 1 270 146H30A8 8 0 0 1 22 138V26A8 8 0 0 1 30 18Z M92 70H208A20 20 0 0 1 208 110H92A20 20 0 0 1 92 70Z"></path>
          <text class="t-year" x="150" y="60" text-anchor="middle">????</text>
          <rect class="t-track" x="40" y="122" width="220" height="11" rx="5.5"></rect>
          <rect class="t-bar" x="40" y="122" width="66" height="11" rx="5.5"></rect>
          <path class="t-foot" stroke-width="5" d="M78 186L90 156H210L222 186"></path>
          <circle class="t-ink" cx="112" cy="174" r="6"></circle><circle class="t-ink" cx="188" cy="174" r="6"></circle>
        </svg>
      </div></div></div>
      <div class="jm-tape__foot"><span class="jm-time">0:09 / 0:30</span><button type="button" class="jm-btn jm-btn--icon-sm" aria-label="Restart the song from the beginning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button></div>
    </div>
    <section class="jm-panel jm-moment" aria-label="Your move">
      <span class="jm-label">Mara's turn</span>
      <h1 class="jm-moment__headline">Between 1994 and 2008?</h1>
      <button type="button" class="jm-btn jm-btn--primary jm-btn--xl" style="min-height: 54px">Lock it in</button>
      <div class="jm-pair"><button type="button" class="jm-btn">Skip song <span class="jm-token" style="font-size: 14px">1</span></button><button type="button" class="jm-btn" aria-label="Buy a card for 3 tokens">Buy a card <span class="jm-token" style="font-size: 14px">3</span></button></div>
    </section>
    <aside class="jm-scoreboard" aria-label="Standings">
      <div class="jm-scoreboard__row jm-scoreboard__row--turn" aria-label="Mara, on turn: 4 cards, 3 tokens"><span class="jm-avatar jm-p1">M</span><span class="jm-scoreboard__score">4</span><span class="jm-token">3</span></div>
      <div class="jm-scoreboard__row" aria-label="Jonas: 6 cards, 1 tokens"><span class="jm-avatar jm-p2">J</span><span class="jm-scoreboard__score">6</span><span class="jm-token">1</span></div>
      <div class="jm-scoreboard__row" aria-label="Lea: 5 cards, 2 tokens"><span class="jm-avatar jm-p3">L</span><span class="jm-scoreboard__score">5</span><span class="jm-token">2</span></div>
      <div class="jm-scoreboard__row" aria-label="Tobi: 3 cards, 2 tokens"><span class="jm-avatar jm-p4">T</span><span class="jm-scoreboard__score">3</span><span class="jm-token">2</span></div>
      <div class="jm-scoreboard__row" aria-label="Sam: 2 cards, 5 tokens"><span class="jm-avatar jm-p5">S</span><span class="jm-scoreboard__score">2</span><span class="jm-token">5</span></div>
    </aside>
  </div>
  <section class="jm-board" aria-label="Mara's timeline">
    <div class="jm-board__head"><h2 class="jm-section">Mara's timeline</h2><span class="jm-meta" style="font-size: 12px">4 of 10</span></div>
    <div class="jm-board__row"><button type="button" class="jm-gap" aria-label="Put it here: before 1975"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button> <div class="jm-card"><span class="jm-card__year">1975</span><span class="jm-card__title">Bohemian Rhapsody</span><span class="jm-card__artist">Queen</span><button type="button" class="jm-card__half jm-card__half--l" aria-label="Put it before 1975"></button><button type="button" class="jm-card__half jm-card__half--r" aria-label="Put it after 1975"></button></div> <button type="button" class="jm-gap" aria-label="Put it here: between 1975 and 1994"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button> <div class="jm-card"><span class="jm-card__year">1994</span><span class="jm-card__title">Zombie</span><span class="jm-card__artist">The Cranberries</span><button type="button" class="jm-card__half jm-card__half--l" aria-label="Put it before 1994"></button><button type="button" class="jm-card__half jm-card__half--r" aria-label="Put it after 1994"></button></div> <div class="jm-card jm-card--mystery"><span class="jm-card__year">????</span><span class="jm-card__title">Mara's pick</span></div> <div class="jm-card"><span class="jm-card__year">2008</span><span class="jm-card__title">Viva la Vida</span><span class="jm-card__artist">Coldplay</span><button type="button" class="jm-card__half jm-card__half--l" aria-label="Put it before 2008"></button><button type="button" class="jm-card__half jm-card__half--r" aria-label="Put it after 2008"></button></div> <button type="button" class="jm-gap" aria-label="Put it here: between 2008 and 2016"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button> <div class="jm-card"><span class="jm-card__year">2016</span><span class="jm-card__title">Redbone</span><span class="jm-card__artist">Childish Gambino</span><button type="button" class="jm-card__half jm-card__half--l" aria-label="Put it before 2016"></button><button type="button" class="jm-card__half jm-card__half--r" aria-label="Put it after 2016"></button></div> <button type="button" class="jm-gap" aria-label="Put it here: after 2016"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
  </section>
</div>
</body>
</html>
