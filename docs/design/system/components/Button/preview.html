<!-- @dsCard group="Actions" height=150 subtitle="primary · secondary · dark · icon · select · chip" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="jm-stage">
  <button type="button" class="jm-btn jm-btn--primary">Challenge</button>
  <button type="button" class="jm-btn jm-btn--primary">Lock it in</button>
  <button type="button" class="jm-btn">Skip · 1 token</button>
  <button type="button" class="jm-btn jm-btn--dark">Keep listening</button>
  <button type="button" class="jm-btn jm-btn--primary" disabled>Next song</button>
  <button type="button" class="jm-btn jm-btn--icon" aria-label="Pass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  <button type="button" class="jm-btn jm-btn--icon" aria-label="Restart song"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
  <button type="button" class="jm-btn jm-btn--square" aria-label="Game menu"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
  <label class="jm-field">As
    <select class="jm-select"><option>Mara (on turn)</option><option>Jonas</option></select>
  </label>
  <span class="jm-chip">QZRK</span>
  <span class="jm-status">Marking…</span>
  <span class="jm-status jm-status--quiet">Passed</span>
</div>
</body>
</html>
