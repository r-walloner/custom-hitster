<!-- @dsCard group="Forms" height=330 width=1000 subtitle="setting · option (picked, with an extra line) · checkbox · player (you, away)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Rows — preview</title></head>
<body>
<div class="jm-stage" style="align-items: flex-start; flex-wrap: nowrap; gap: 24px">
  <div style="display: flex; flex-direction: column; width: 280px">
    <div class="jm-setting">
      <div class="jm-setting__text"><span class="jm-label">Music plays on</span><span class="jm-setting__value">Living room TV</span></div>
      <button type="button" class="jm-btn">Change</button>
    </div>
    <div class="jm-setting">
      <div class="jm-setting__text"><span class="jm-label">Your songs</span><span class="jm-setting__value"><span class="jm-importing jm-importing--strong"><span>Importing…</span><span class="jm-progress jm-progress--sm" role="progressbar" aria-label="Importing your songs" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42"><span style="width: 42%"></span></span></span></span></div>
      <button type="button" class="jm-btn">Change</button>
    </div>
    <div class="jm-setting">
      <div class="jm-setting__text"><span class="jm-label">Rules</span><span class="jm-setting__value">First to 10 cards</span></div>
      <button type="button" class="jm-btn">View</button>
    </div>
    <div style="height: 10px"></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div class="jm-player jm-player--list jm-player--you"><span class="jm-avatar jm-p3">L</span><span class="jm-player__name">Lea<small>Guest</small></span><button type="button" class="jm-btn jm-btn--icon jm-btn--bare" aria-label="Change your name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"></path></svg></button></div>
      <div class="jm-player jm-player--list"><span class="jm-avatar jm-avatar--away jm-p2">S</span><span class="jm-player__name">Sam<small>Reconnecting…</small></span><button type="button" class="jm-btn jm-btn--icon jm-btn--bare" aria-label="Remove Sam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button></div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; width: 340px">
    <div class="jm-option-box">
      <button type="button" class="jm-option" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8"></path></svg><span class="jm-player__name">Living room TV<small>TV, playing now</small></span><span class="jm-option__dot"></span></button>
      <div class="jm-option-box__more"><button type="button" class="jm-btn" style="width: 96px; min-height: 36px" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M15.5 9a4 4 0 0 1 0 6"></path></svg>Test</button><span class="jm-caption">Plays 10 seconds of a song from your library.</span></div>
    </div>
    <button type="button" class="jm-option" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M11 18.5h2"></path></svg><span class="jm-player__name">Mara's iPhone<small>Phone</small></span><span class="jm-option__dot"></span></button>
    <button type="button" class="jm-option" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"></rect><circle cx="12" cy="14" r="3"></circle><path d="M12 7h.01"></path></svg><span class="jm-player__name">Kitchen speaker<small>Can't be picked: says why here.</small></span></button>
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px; width: 300px">
    <label class="jm-check-row jm-check-row--pinned"><input class="jm-check" type="checkbox" checked><span class="jm-check-row__text"><span class="jm-check-row__name">Liked songs</span><span class="jm-caption">Everything you've hearted</span></span><span class="jm-check-row__count">1,206</span></label>
    <label class="jm-check-row"><input class="jm-check" type="checkbox" checked><span class="jm-check-row__text"><span class="jm-check-row__name">Your top songs</span><span class="jm-caption" style="display: flex; align-items: center; gap: 8px"><span class="jm-progress jm-progress--sm" style="flex: none; width: 96px; height: 8px; border-width: 1.5px"><span style="width: 40%"></span></span>Importing…</span></span><span class="jm-check-row__count"></span></label>
    <label class="jm-check-row"><input class="jm-check" type="checkbox" checked><span class="jm-check-row__text"><span class="jm-check-row__name">Car karaoke</span><span class="jm-caption">Waiting to import</span></span><span class="jm-check-row__count">84</span></label>
    <label class="jm-check-row jm-check-row--off"><input class="jm-check" type="checkbox"><span class="jm-check-row__text"><span class="jm-check-row__name">Lo-fi to study to</span><span class="jm-caption">Playlist</span></span><span class="jm-check-row__count">210</span></label>
  </div>
</div>
</body>
</html>
