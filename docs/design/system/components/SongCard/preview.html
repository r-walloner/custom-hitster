<!-- @dsCard group="Board" height=150 subtitle="revealed · mystery in a gap · empty gaps" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SongCard — preview</title></head>
<body>
<div class="jm-stage" style="gap: 16px">
  <div class="jm-card jm-p3">
    <span class="jm-card__year">1975</span>
    <span class="jm-card__title">Bohemian Rhapsody</span>
    <span class="jm-card__artist">Queen</span>
    <span class="jm-card__via">Lea</span>
  </div>
  <button type="button" class="jm-gap" aria-label="Place between 1975 and 1994"></button>
  <button type="button" class="jm-gap" aria-pressed="true" aria-label="Selected: between 1994 and 2008"></button>
  <div class="jm-card jm-card--mystery">
    <span class="jm-card__year">????</span>
    <span class="jm-card__title" style="margin: 0">Mara's pick</span>
  </div>
  <div class="jm-card jm-p2">
    <span class="jm-card__year">2016</span>
    <span class="jm-card__title">Redbone</span>
    <span class="jm-card__artist">Childish Gambino</span>
    <span class="jm-card__via">Jonas</span>
  </div>
</div>
</body>
</html>
