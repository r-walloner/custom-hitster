<!-- @dsCard group="Turn" height=200 subtitle="initial · cards · tokens, on turn highlighted; a button that opens the full scoreboard" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Scoreboard — preview</title></head>
<body>
<div class="jm-stage">
  <div style="height: 172px; display: flex"><button type="button" class="jm-scoreboard" aria-label="Scoreboard. Mara, on turn: 4 cards, 3 tokens. Jonas: 6 cards, 1 token. Lea: 5 cards, 2 tokens. Tobi: 3 cards, 2 tokens. Sam: 2 cards, 5 tokens. Open the full scoreboard.">
      <span class="jm-scoreboard__row jm-scoreboard__row--turn"><span class="jm-avatar jm-p1" aria-hidden="true">M</span><span class="jm-scoreboard__score">4</span><span class="jm-token">3</span></span>
      <span class="jm-scoreboard__row"><span class="jm-avatar jm-p2" aria-hidden="true">J</span><span class="jm-scoreboard__score">6</span><span class="jm-token">1</span></span>
      <span class="jm-scoreboard__row"><span class="jm-avatar jm-p3" aria-hidden="true">L</span><span class="jm-scoreboard__score">5</span><span class="jm-token">2</span></span>
      <span class="jm-scoreboard__row"><span class="jm-avatar jm-p4" aria-hidden="true">T</span><span class="jm-scoreboard__score">3</span><span class="jm-token">2</span></span>
      <span class="jm-scoreboard__row"><span class="jm-avatar jm-p5" aria-hidden="true">S</span><span class="jm-scoreboard__score">2</span><span class="jm-token">5</span></span>
    </button></div>
</div>
</body>
</html>
