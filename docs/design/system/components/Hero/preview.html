<!-- @dsCard group="Brand" height=300 subtitle="winner: big moment, slow tape, drifting cards" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Hero — preview</title></head>
<body>
<div class="jm-stage">
  <section class="jm-hero" style="width: 480px; height: 270px; display: flex; flex-direction: column; gap: 10px" aria-labelledby="hero-head">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="hero-head" class="jm-big-moment" style="font-size: 34px; line-height: 40px">Mara wins!</h2>
      <p class="jm-meta" style="margin: 0; color: var(--ink); font-weight: 800; font-size: 15px">Sam was one card behind.</p>
    </div>
    <div style="position: relative; flex: 1" aria-hidden="true">
      <div class="jm-float" style="position: absolute; left: 200px; top: -6px; animation-duration: 3.1s">
        <div class="jm-card" style="transform: rotate(-14deg) scale(0.62)"><span class="jm-card__year">1965</span><span class="jm-card__title">Satisfaction</span><span class="jm-card__artist">The Rolling Stones</span></div>
      </div>
      <div class="jm-float" style="position: absolute; left: 300px; top: -20px; animation-delay: -2.6s; animation-duration: 4.2s">
        <div class="jm-card" style="transform: rotate(11deg) scale(0.7)"><span class="jm-card__year">1983</span><span class="jm-card__title">Sweet Dreams</span><span class="jm-card__artist">Eurythmics</span></div>
      </div>
      <div class="jm-tape jm-tape--bounce jm-tape--slow is-playing" style="position: absolute; left: 10px; top: 4px; z-index: 2">
        <div class="jm-tape__bob"><div class="jm-tape__shell">
          <svg viewBox="0 0 300 190" width="170" height="108" style="width: 170px">
            <rect class="t-shell" x="4" y="4" width="292" height="182" rx="18" stroke-width="7"></rect>
            <circle class="t-ink" cx="17" cy="17" r="4.5"></circle><circle class="t-ink" cx="283" cy="17" r="4.5"></circle><circle class="t-ink" cx="17" cy="173" r="4.5"></circle><circle class="t-ink" cx="283" cy="173" r="4.5"></circle>
            <rect class="t-window" x="92" y="70" width="116" height="40" rx="20"></rect>
            <circle class="t-pack" cx="105" cy="90" r="36" style="transform: scale(0.46)"></circle>
            <circle class="t-pack" cx="195" cy="90" r="36" style="transform: scale(0.94)"></circle>
            <g class="t-reel"><circle class="t-hub" cx="105" cy="90" r="13" stroke-width="4"></circle><path class="t-spoke" d="M105 80v20M96.3 85l17.4 10M96.3 95l17.4-10" stroke-width="4"></path></g>
            <g class="t-reel"><circle class="t-hub" cx="195" cy="90" r="13" stroke-width="4"></circle><path class="t-spoke" d="M195 80v20M186.3 85l17.4 10M186.3 95l17.4-10" stroke-width="4"></path></g>
            <path class="t-label" fill-rule="evenodd" stroke-width="5" d="M30 18H270A8 8 0 0 1 278 26V138A8 8 0 0 1 270 146H30A8 8 0 0 1 22 138V26A8 8 0 0 1 30 18Z M92 70H208A20 20 0 0 1 208 110H92A20 20 0 0 1 92 70Z"></path>
            <text class="t-year" x="150" y="60" text-anchor="middle">2019</text>
            <rect class="t-track" x="40" y="122" width="220" height="11" rx="5.5"></rect>
            <rect class="t-bar" x="40" y="122" width="198" height="11" rx="5.5"></rect>
            <path class="t-foot" stroke-width="5" d="M78 186L90 156H210L222 186"></path>
            <circle class="t-ink" cx="112" cy="174" r="6"></circle><circle class="t-ink" cx="188" cy="174" r="6"></circle>
          </svg>
        </div></div>
      </div>
      <div class="jm-float" style="position: absolute; left: 210px; top: 52px; z-index: 3; animation-delay: -0.2s; animation-duration: 3.4s">
        <div class="jm-card jm-card--new" style="transform: rotate(var(--tilt)) scale(0.72)"><span class="jm-card__year">2019</span><span class="jm-card__title">Bad Guy</span><span class="jm-card__artist">Billie Eilish</span></div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
