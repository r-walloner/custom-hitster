<!-- @dsCard group="Forms" height=90 subtitle="stepper · segmented toggles" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Stepper — preview</title></head>
<body>
<div class="jm-stage" style="gap: 28px">
  <div class="jm-stepper" role="group" aria-label="Cards to win">
    <button type="button" class="jm-btn jm-btn--icon" aria-label="Fewer cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
    <output class="jm-stepper__value">10</output>
    <button type="button" class="jm-btn jm-btn--icon" aria-label="More cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>
  <div class="jm-segmented" role="group" aria-label="Time to challenge">
    <button type="button" class="jm-btn jm-btn--toggle" aria-pressed="false">5 s</button>
    <button type="button" class="jm-btn jm-btn--toggle" aria-pressed="false">10 s</button>
    <button type="button" class="jm-btn jm-btn--toggle" aria-pressed="true">15 s</button>
    <button type="button" class="jm-btn jm-btn--toggle" aria-pressed="false">20 s</button>
  </div>
  <div class="jm-segmented" role="group" aria-label="Next song starts">
    <button type="button" class="jm-btn jm-btn--toggle" aria-pressed="false">5 s</button>
    <button type="button" class="jm-btn jm-btn--toggle" aria-pressed="false">10 s</button>
    <button type="button" class="jm-btn jm-btn--toggle" aria-pressed="false">15 s</button>
    <button type="button" class="jm-btn jm-btn--toggle" aria-pressed="true">Tap</button>
  </div>
</div>
</body>
</html>
