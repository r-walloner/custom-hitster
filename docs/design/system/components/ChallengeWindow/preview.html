<!-- @dsCard group="Turn" height=200 subtitle="timed window: countdown ring + one cell per challenger" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ChallengeWindow — preview</title></head>
<body>
<div style="padding: 16px; max-width: 470px">
  <section class="jm-panel jm-challenge" aria-label="Challenge window">
    <div class="jm-challenge__head">
      <div class="jm-challenge__text">
        <span class="jm-label">Challenge window</span>
        <h2 class="jm-headline">Mara put it between 1994 and 2008.</h2>
      </div>
      <div class="jm-ring" style="--p: 60" role="timer" aria-label="6 seconds left"><span>6</span></div>
    </div>
    <div class="jm-challengers">
      <div class="jm-challenger">
        <span class="jm-avatar jm-p2">J</span>
        <span class="jm-challenger__name">Jonas</span>
        <span class="jm-status">Marking…</span>
      </div>
      <div class="jm-challenger">
        <span class="jm-avatar jm-p3">L</span>
        <span class="jm-challenger__name">Lea</span>
        <div class="jm-challenger__actions">
          <button type="button" class="jm-btn jm-btn--primary jm-btn--sm-pad">Challenge</button>
          <button type="button" class="jm-btn jm-btn--icon" aria-label="Pass for Lea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
      </div>
      <div class="jm-challenger">
        <span class="jm-avatar jm-p4">T</span>
        <span class="jm-challenger__name">Tobi</span>
        <span class="jm-status jm-status--quiet">Passed</span>
      </div>
      <div class="jm-challenger">
        <span class="jm-avatar jm-p5">S</span>
        <span class="jm-challenger__name">Sam<small>no phone</small></span>
        <div class="jm-challenger__actions">
          <button type="button" class="jm-btn jm-btn--primary jm-btn--sm-pad">Challenge</button>
          <button type="button" class="jm-btn jm-btn--icon" aria-label="Pass for Sam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
