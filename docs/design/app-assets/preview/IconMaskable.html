<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamster maskable icon, 512</title>
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components/bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template"><div style="position: relative; width: 512px; height: 512px; background: #f6eedf">
  <iframe src="Icon512.html?mark=cassette&size=512&ground=paper&fill=0.62" title="Icon512" tabindex="-1" aria-hidden="true" style="display: block; width: 512px; height: 512px; border: 0;"></iframe>
  <sc-if value="{{showSafeZone}}" hint-placeholder-val="{{false}}">
    <div aria-hidden="true" style="position: absolute; left: 51px; top: 51px; width: 410px; height: 410px; box-sizing: border-box; border: 3px dashed #b83a20; border-radius: 999px; pointer-events: none"></div>
  </sc-if>
</div></template>
<script src="../../exploration/preview/dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    return { showSafeZone: this.props.showSafeZone ?? false };
  }
}
DCRuntime.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-template').content, Object.assign({"showSafeZone": false}, Object.fromEntries(new URLSearchParams(location.search))));
</script>
</body>
</html>
