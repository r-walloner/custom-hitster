<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jamster icons, cassette variant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 640px; box-sizing: border-box; padding: 44px 48px; background: #f6eedf; color: #2a211c; font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px">

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font: 500 12px/16px 'DM Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; color: #b83a20">The app icon</span>
    <h2 style="margin: 0; font-size: 24px; line-height: 28px; font-weight: 800">The cover's cassette as the icon</h2>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 28px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <div style="width: 236px; height: 236px; box-sizing: border-box; background: #fffaf0; border: 2px solid #2a211c; border-radius: 16px; box-shadow: 3px 3px 0 #2a211c; display: flex; align-items: center; justify-content: center">
        <dc-import name="Icon512" mark="cassette" size="200" ground="transparent" fill="0.9" hint-size="200px,200px"></dc-import>
      </div>
      <figcaption style="display: flex; flex-direction: column"><span style="font: 500 13px/18px 'DM Mono', monospace">icon-512 / 192 · any</span><span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5c4f44">shown at 200</span></figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <div style="position: relative; width: 200px; height: 200px; border: 2px solid #2a211c; border-radius: 16px; overflow: hidden">
        <dc-import name="Icon512" mark="cassette" size="200" ground="paper" fill="0.62" hint-size="200px,200px"></dc-import>
        <div aria-hidden="true" style="position: absolute; left: 20px; top: 20px; width: 160px; height: 160px; box-sizing: border-box; border: 2px dashed #b83a20; border-radius: 999px"></div>
      </div>
      <figcaption style="display: flex; flex-direction: column"><span style="font: 500 13px/18px 'DM Mono', monospace">icon-maskable-512</span><span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5c4f44">inside the safe circle</span></figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <div style="width: 180px; height: 180px; border-radius: 40px; overflow: hidden; border: 2px solid #2a211c">
        <dc-import name="Icon512" mark="cassette" size="180" ground="paper" fill="0.76" hint-size="180px,180px"></dc-import>
      </div>
      <figcaption style="display: flex; flex-direction: column"><span style="font: 500 13px/18px 'DM Mono', monospace">apple-touch-icon</span><span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5c4f44">actual size, iOS corners</span></figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <div style="width: 64px; height: 64px; border-radius: 15px; overflow: hidden; border: 2px solid #2a211c">
        <dc-import name="Icon512" mark="cassette" size="64" ground="paper" fill="0.8" hint-size="64px,64px"></dc-import>
      </div>
      <figcaption style="display: flex; flex-direction: column"><span style="font: 500 13px/18px 'DM Mono', monospace">home screen</span><span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5c4f44">as small as iOS draws it</span></figcaption>
    </figure>
  </div>

  <div style="display: flex; gap: 24px">
    <div style="display: flex; align-items: flex-end; gap: 24px; background: #ffffff; border: 2px solid #2a211c; border-radius: 12px; padding: 16px 22px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Cassette favicon, 16 pixels"><rect x="2" y="4.5" width="13" height="9" rx="2" fill="#2a211c"></rect><rect x="0.5" y="3" width="13" height="9" rx="2" fill="#ee5a3c" stroke="#2a211c" stroke-width="1"></rect><rect x="3" y="5.5" width="8" height="3.5" rx="1.75" fill="#3a2e26"></rect><circle cx="5" cy="7.25" r="1" fill="#fffaf0"></circle><circle cx="9" cy="7.25" r="1" fill="#fffaf0"></circle></svg>
        <span style="font: 500 11px/14px 'DM Mono', monospace; color: #5c4f44">16</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Cassette favicon, 32 pixels"><rect x="4.25" y="8" width="26" height="17.5" rx="3.5" fill="#2a211c"></rect><rect x="1.75" y="5.5" width="26" height="17.5" rx="3.5" fill="#ee5a3c" stroke="#2a211c" stroke-width="2.25"></rect><rect x="5" y="8.5" width="19.5" height="9" rx="2" fill="#fffaf0" stroke="#2a211c" stroke-width="1.5"></rect><rect x="8" y="11" width="13.5" height="4.5" rx="2.25" fill="#3a2e26"></rect><circle cx="10.5" cy="13.25" r="1.6" fill="#fffaf0"></circle><circle cx="19" cy="13.25" r="1.6" fill="#fffaf0"></circle><path d="M9 23L10.5 20H19L20.5 23" fill="#d44a2e" stroke="#2a211c" stroke-width="1.5" stroke-linejoin="round"></path></svg>
        <span style="font: 500 11px/14px 'DM Mono', monospace; color: #5c4f44">32</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="64" height="64" viewBox="0 0 32 32" role="img" aria-label="Cassette favicon, 64 pixels"><rect x="4.25" y="8" width="26" height="17.5" rx="3.5" fill="#2a211c"></rect><rect x="1.75" y="5.5" width="26" height="17.5" rx="3.5" fill="#ee5a3c" stroke="#2a211c" stroke-width="2.25"></rect><rect x="5" y="8.5" width="19.5" height="9" rx="2" fill="#fffaf0" stroke="#2a211c" stroke-width="1.5"></rect><rect x="8" y="11" width="13.5" height="4.5" rx="2.25" fill="#3a2e26"></rect><circle cx="10.5" cy="13.25" r="1.6" fill="#fffaf0"></circle><circle cx="19" cy="13.25" r="1.6" fill="#fffaf0"></circle><path d="M9 23L10.5 20H19L20.5 23" fill="#d44a2e" stroke="#2a211c" stroke-width="1.5" stroke-linejoin="round"></path></svg>
        <span style="font: 500 11px/14px 'DM Mono', monospace; color: #5c4f44">64</span>
      </div>
      <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5c4f44; max-width: 150px; padding-bottom: 20px">favicon: label and reels only, the year and bar drop out</span>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 24px; background: #202124; border: 2px solid #2a211c; border-radius: 12px; padding: 16px 22px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Cassette favicon on dark, 16 pixels"><rect x="2" y="4.5" width="13" height="9" rx="2" fill="#f6eedf"></rect><rect x="0.5" y="3" width="13" height="9" rx="2" fill="#ee5a3c" stroke="#f6eedf" stroke-width="1"></rect><rect x="3" y="5.5" width="8" height="3.5" rx="1.75" fill="#3a2e26"></rect><circle cx="5" cy="7.25" r="1" fill="#fffaf0"></circle><circle cx="9" cy="7.25" r="1" fill="#fffaf0"></circle></svg>
        <span style="font: 500 11px/14px 'DM Mono', monospace; color: #bdc1c6">16</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Cassette favicon on dark, 32 pixels"><rect x="4.25" y="8" width="26" height="17.5" rx="3.5" fill="#f6eedf"></rect><rect x="1.75" y="5.5" width="26" height="17.5" rx="3.5" fill="#ee5a3c" stroke="#f6eedf" stroke-width="2.25"></rect><rect x="5" y="8.5" width="19.5" height="9" rx="2" fill="#fffaf0" stroke="#2a211c" stroke-width="1.5"></rect><rect x="8" y="11" width="13.5" height="4.5" rx="2.25" fill="#3a2e26"></rect><circle cx="10.5" cy="13.25" r="1.6" fill="#fffaf0"></circle><circle cx="19" cy="13.25" r="1.6" fill="#fffaf0"></circle><path d="M9 23L10.5 20H19L20.5 23" fill="#d44a2e" stroke="#f6eedf" stroke-width="1.5" stroke-linejoin="round"></path></svg>
        <span style="font: 500 11px/14px 'DM Mono', monospace; color: #bdc1c6">32</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="64" height="64" viewBox="0 0 32 32" role="img" aria-label="Cassette favicon on dark, 64 pixels"><rect x="4.25" y="8" width="26" height="17.5" rx="3.5" fill="#f6eedf"></rect><rect x="1.75" y="5.5" width="26" height="17.5" rx="3.5" fill="#ee5a3c" stroke="#f6eedf" stroke-width="2.25"></rect><rect x="5" y="8.5" width="19.5" height="9" rx="2" fill="#fffaf0" stroke="#2a211c" stroke-width="1.5"></rect><rect x="8" y="11" width="13.5" height="4.5" rx="2.25" fill="#3a2e26"></rect><circle cx="10.5" cy="13.25" r="1.6" fill="#fffaf0"></circle><circle cx="19" cy="13.25" r="1.6" fill="#fffaf0"></circle><path d="M9 23L10.5 20H19L20.5 23" fill="#d44a2e" stroke="#f6eedf" stroke-width="1.5" stroke-linejoin="round"></path></svg>
        <span style="font: 500 11px/14px 'DM Mono', monospace; color: #bdc1c6">64</span>
      </div>
      <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #e8eaed; max-width: 130px; padding-bottom: 20px">dark tabs: coral kept, paper outline</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":640}}'>

  }

</body>
</html>
