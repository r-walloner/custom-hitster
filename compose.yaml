services:
  backend:
    build: ./backend
    image: jamster-game-backend
    restart: unless-stopped
    env_file: .env
    environment:
      JAMSTER_DATA_DIR: /data
      JAMSTER_LOG_TO: stdout
    volumes:
      - jamster-game-data:/data

  frontend:
    build: ./frontend
    image: jamster-game-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  jamster-game-data:
